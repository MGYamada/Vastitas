name: Set up sequential OpenBLAS
description: Build or restore the pinned LP64 installation in the runner temp directory.
runs:
  using: composite
  steps:
    - name: Identify the build host and CPU profile
      id: host
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) cpu=HASWELL ;;
          macOS-*) cpu=$(sysctl -n machdep.cpu.brand_string) ;;
          *) echo "Unsupported OpenBLAS build host $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        echo "profile=${ImageOS:?}-${ImageVersion:?}-$cpu" >> "$GITHUB_OUTPUT"
    - name: Restore the host-specific static installation
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/vastitas-openblas
        key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.profile }}-${{ hashFiles('scripts/build_openblas.py', '.github/actions/setup-openblas/action.yml') }}
    - name: Build pinned sequential LP64 OpenBLAS
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        target=()
        if [[ "$RUNNER_OS" == Linux ]]; then
          target=(--target HASWELL)
        fi
        python3 scripts/build_openblas.py --prefix "$RUNNER_TEMP/vastitas-openblas" --jobs 4 "${target[@]}"
