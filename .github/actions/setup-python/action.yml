name: Set up CI Python
description: Install the pinned Python and verify it runs with the native loader environment.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.15.2'
    - name: Validate Python without a loader override
      shell: bash
      run: bash scripts/check_ci_python.sh
