name: Set up project Rust
description: Install the channel selected by the checked-out rust-toolchain.toml.
inputs:
  components:
    description: Additional components needed by this job.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        python3 -c 'from pathlib import Path; import tomllib; print("channel=" + tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ inputs.components }}
