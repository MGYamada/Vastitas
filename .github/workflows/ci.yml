name: CI

on:
  # Pull requests run once on pull_request; branch pushes no longer duplicate them.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Retained source-workspace archives are replayed in their own job.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/experiments/source_workspace/results/*/evidence.zip
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Validate Python without a loader override
        run: bash scripts/check_ci_python.sh
      - name: Contributor guidance limits and equality
        run: python3 scripts/check_docs.py
      # The claims of docs/spec/: format, statuses, tests and the CI steps that
      # run them, statement pin names and generated chapters (#647).
      - name: Specification files and generated chapters
        run: python3 scripts/check_spec.py
      - name: Verify sparse source evidence retrieval
        run: python3 -m unittest discover -s experiments/source_workspace -p test_fetch.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify the registry distribution builds from its packaged sources
        run: cargo package --locked
      - name: Dependency-boundary checker tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Contraction-tree harness tests
        run: python3 -m unittest discover -s experiments/contraction_trees -p 'test_*.py'
      - name: Allocation-audit transformation tests
        run: python3 -m unittest discover -s experiments/allocation_audit -p 'test_*.py'
      - name: Stock allocation capability verifier tests
        run: python3 -m unittest discover -s experiments/stock_allocation_capabilities -p 'test_*.py'
      - name: Diagnostic Lean allocator verifier tests
        run: python3 -m unittest discover -s experiments/lean_allocation_diagnostic -p 'test_*.py'
      - name: Private heap lifetime verifier boundary tests
        run: python3 -m unittest discover -s experiments/lean_allocation_lifetimes -p 'test_*.py'
      - name: Verify retained production allocation record
        run: python3 experiments/allocation_audit/verify.py experiments/allocation_audit/results/2026-11-01-macos-production/evidence.zip
      - name: Dependency boundaries
        run: python3 scripts/check_boundaries.py
      - name: Runtime-shape verifier and mutation tests
        run: python3 -m unittest discover -s experiments/runtime_shapes -p 'test_*.py'
      - name: Iterator-prefix protocol model tests
        run: python3 -m unittest discover -s experiments/iterator_prefix -p 'test_*.py'
      - name: Generate and check the standard-library package
        # The package is ignored by Git, so a clean checkout has none: --check
        # must first reject its absence, then accept a fresh deterministic build.
        # Stale and extra files are covered by scripts/test_build_stdlib_package.py.
        run: |
          if python3 scripts/build_stdlib_package.py --check; then
            echo "::error::--check accepted a missing standard-library package"
            exit 1
          fi
          python3 scripts/build_stdlib_package.py
          python3 scripts/build_stdlib_package.py --check

  compiler-without-mathlib:
    name: Native compiler (${{ matrix.os }}, no mathlib)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /config/
            /tests/
            /examples/
            /stdlib/
            /scripts/
            /lean-kernel/
            /Cargo.toml
            /Cargo.lock
            /build.rs
            /LICENSE
            /rust-toolchain.toml
            /lean-toolchain
            /.gitignore
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Validate Python without a loader override
        run: bash scripts/check_ci_python.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
      - name: Install checksum-pinned elan
        run: python3 scripts/install_ci_elan.py --destination "$RUNNER_TEMP/vastitas-elan"
      - name: Build the standalone Lean kernel
        run: lake -d lean-kernel build vastitas-kernel
      - name: Check dependency boundary
        run: |
          test ! -d lean
          python3 scripts/check_boundaries.py
      - name: Checked-IR, dispatch, and function regressions
        run: bash scripts/check_kernel_regressions.sh
      - name: Declaration-driven Core native regressions
        run: bash scripts/check_indexed_native.sh
      - name: Checked storage native adapter and failure cleanup (no BLAS)
        run: bash scripts/check_storage_native.sh
      - name: Rust, native compiler, and standard-library tests
        run: |
          python3 scripts/build_stdlib_package.py
          cargo test --locked --all-targets
      - name: Lean export audit through the pinned toolchain's nanoda_bin
        run: |
          # The integration tests above run the same checker; this step records
          # which toolchain binary the built CLI resolved on this platform.
          target/debug/vastitas audit-lean tests/fixtures/lean_audit/id_prop.ndjson \
            | tee "$RUNNER_TEMP/lean-audit.txt"
          grep -F 'nanoda_bin 0.4.19 from the Lean 4.35.0 toolchain' "$RUNNER_TEMP/lean-audit.txt"
          grep -F '/toolchains/leanprover--lean4---v4.35.0/bin/nanoda_bin' "$RUNNER_TEMP/lean-audit.txt"
      - name: Public resource cleanup and nested failure precedence (no BLAS)
        run: python3 scripts/check_resource_cleanup.py
      - name: Diagnostic reference against the built compiler
        run: |
          test -x target/debug/vastitas
          test -x lean-kernel/.lake/build/bin/vastitas-kernel
          python3 -m unittest discover -s scripts -p 'test_diagnostic_reference.py' -v

  numerical-adapter:
    name: Optional GEMM adapter (${{ matrix.os }}, OpenBLAS 0.3.34)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Retained source-workspace archives are replayed in their own job.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/experiments/source_workspace/results/*/evidence.zip
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Validate Python without a loader override
        run: bash scripts/check_ci_python.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
      - name: Identify OpenBLAS build host
        id: blas-host
        run: |
          cpu=HASWELL
          # The macOS build lets OpenBLAS select kernels for the host CPU.
          if [[ "$RUNNER_OS" == macOS ]]; then
            cpu=$(sysctl -n machdep.cpu.brand_string)
          fi
          echo "profile=${ImageOS:?}-${ImageVersion:?}-$cpu" >> "$GITHUB_OUTPUT"
      - name: Cache pinned sequential LP64 OpenBLAS
        id: blas-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vastitas-openblas
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.blas-host.outputs.profile }}-${{ hashFiles('scripts/build_openblas.py', '.github/workflows/ci.yml') }}
      - name: Build pinned sequential LP64 OpenBLAS
        if: steps.blas-cache.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/build_openblas.py --prefix "$RUNNER_TEMP/vastitas-openblas" --jobs 4 --target HASWELL
          else
            python3 scripts/build_openblas.py --prefix "$RUNNER_TEMP/vastitas-openblas" --jobs 4
          fi
      - name: Install native uninitialized-memory checker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Adapter, sanitizer, ABI and uninitialized-memory tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/check_gemm_native.py --prefix "$RUNNER_TEMP/vastitas-openblas" --valgrind
          else
            python3 scripts/check_gemm_native.py --prefix "$RUNNER_TEMP/vastitas-openblas"
          fi
      - name: Standalone C baseline output, costs and failure cleanup
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/check_plain_c_baselines.py --prefix "$RUNNER_TEMP/vastitas-openblas" --output "$RUNNER_TEMP/plain-c-baselines" --valgrind
          else
            python3 scripts/check_plain_c_baselines.py --prefix "$RUNNER_TEMP/vastitas-openblas" --output "$RUNNER_TEMP/plain-c-baselines" --no-leak-sanitizer
          fi
      - name: Retain standalone C validation (no performance acceptance)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plain-c-baselines-${{ matrix.os }}-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/plain-c-baselines/*.json
            ${{ runner.temp }}/plain-c-baselines/inputs/
            ${{ runner.temp }}/plain-c-baselines/cases/**/case.h
            ${{ runner.temp }}/plain-c-baselines/cases/**/*-symbols.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Install checksum-pinned elan
        run: python3 scripts/install_ci_elan.py --destination "$RUNNER_TEMP/vastitas-elan"
      - name: Build the independent resource checker
        run: lake -d lean-kernel build vastitas-kernel storage-native-fixture
      - name: Calibrate stock Lean allocation observation (no timing)
        run: |
          python3 experiments/stock_allocation_capabilities/run.py --out "$RUNNER_TEMP/vastitas-stock-capabilities" --cc cc
          python3 experiments/stock_allocation_capabilities/verify.py "$RUNNER_TEMP/vastitas-stock-capabilities"
      - name: Retain stock allocation capability observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stock-allocation-capabilities-${{ matrix.os }}-${{ github.event_name }}
          path: ${{ runner.temp }}/vastitas-stock-capabilities/
          if-no-files-found: ignore
          retention-days: 30
      - name: Install C++ headers for the private allocator rebuild
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libc++-dev libc++abi-dev
      - name: Calibrate private Lean allocator diagnostics (no timing)
        run: |
          python3 experiments/lean_allocation_diagnostic/run.py --out "$RUNNER_TEMP/vastitas-lean-diagnostic" --cc cc --cxx clang++
          python3 experiments/lean_allocation_diagnostic/verify.py "$RUNNER_TEMP/vastitas-lean-diagnostic"
          VASTITAS_LEAN_DIAGNOSTIC_RECORD="$RUNNER_TEMP/vastitas-lean-diagnostic" python3 -m unittest discover -s experiments/lean_allocation_diagnostic -p 'test_*.py'
      - name: Retain private allocator calibration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-allocation-diagnostic-${{ matrix.os }}-${{ github.event_name }}
          path: ${{ runner.temp }}/vastitas-lean-diagnostic/
          if-no-files-found: ignore
          retention-days: 30
      - name: Calibrate private block lifetimes and interval peaks (no timing)
        run: |
          python3 experiments/lean_allocation_lifetimes/run.py --out "$RUNNER_TEMP/vastitas-heap-lifetimes" --mimalloc-archive "$RUNNER_TEMP/vastitas-lean-diagnostic/inputs/mimalloc-v3.4.5.tar.gz"
          python3 experiments/lean_allocation_lifetimes/verify.py "$RUNNER_TEMP/vastitas-heap-lifetimes"
          VASTITAS_HEAP_LIFETIME_RECORD="$RUNNER_TEMP/vastitas-heap-lifetimes" python3 -m unittest discover -s experiments/lean_allocation_lifetimes -p 'test_*.py'
      - name: Retain private block lifetime calibration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-heap-lifetimes-${{ matrix.os }}-${{ github.event_name }}
          path: ${{ runner.temp }}/vastitas-heap-lifetimes/
          include-hidden-files: true # Complete checksum-pinned upstream source tree.
          if-no-files-found: ignore
          retention-days: 30
      - name: Exact checked GEMM schedules and generated native cleanup
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/check_gemm_checked.py --prefix "$RUNNER_TEMP/vastitas-openblas" --lean-cc cc
          else
            python3 scripts/check_gemm_checked.py --prefix "$RUNNER_TEMP/vastitas-openblas"
          fi
      - name: Public typed real and complex GEMM source execution
        env:
          OPENBLAS_NUM_THREADS: '1'
          VASTITAS_TEST_OPENBLAS_PREFIX: ${{ runner.temp }}/vastitas-openblas
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export VASTITAS_TEST_NATIVE_CC=cc
          fi
          cargo test --locked --test numerical_source --test tensor_source --test tree_source --test cached_packing --test diagonal_metrics --test runtime_shape_source -- --ignored

  oracle:
    # Preserve the repository's required-check name; this job is Mathlib-free.
    name: Lean proofs and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Retained source-workspace archives are replayed in their own job.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/experiments/source_workspace/results/*/evidence.zip
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Validate Python without a loader override
        run: bash scripts/check_ci_python.sh
      - name: Check proof dependency boundary before Lake resolution
        run: python3 scripts/check_boundaries.py
      - name: Install checksum-pinned elan
        run: python3 scripts/install_ci_elan.py --destination "$RUNNER_TEMP/vastitas-elan"
      - name: Build and audit the proof-only oracle
        run: lake -d lean build VastitasOracle
      - name: Fetch the pinned external axiom auditor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: leanprover-community/axiom-audit
          ref: 46024e005996495c65ef609368e11ab39c4222e3 # v0.1.2
          path: .ci-tools/axiom-audit
          persist-credentials: false
      - name: Build and run the external axiom auditor
        run: |
          cp lean/lean-toolchain .ci-tools/axiom-audit/lean-toolchain
          lake -d .ci-tools/axiom-audit build
          cd lean
          lake env ../.ci-tools/axiom-audit/.lake/build/bin/axiom-audit --root VastitasOracle --allow propext,Classical.choice,Quot.sound
      # The audit enumerates every kernel and oracle source module and needs
      # each one built: library roots (nothing imports `VastitasKernel`),
      # executable roots and regression modules.
      - name: Build every kernel library and executable root for the audit
        run: |
          lake -d lean-kernel build VastitasKernel VastitasPromotion VastitasPublicTest VastitasStorageTest VastitasAlgebraTest vastitas-kernel storage-native-fixture numerical-native-fixture
          bash scripts/check_kernel_regressions.sh
      - name: Audit axioms and opaque code of every kernel and oracle module
        run: cd lean && lake env lean -DwarningAsError=true ../scripts/audit_axioms.lean
      # Each pinned oracle theorem and kernel definition of docs/spec/: module,
      # kind and axioms, and the statement hash of each theorem (#647).
      - name: Resolve the oracle claims of the specifications
        env:
          VASTITAS_SPEC_INPUT: ../docs/spec/pins/oracle.json
        run: cd lean && lake env lean -DwarningAsError=true ../scripts/spec_resolve.lean
      - name: Iterator-prefix Lean draft and axiom audit
        # The compiler job's sparse checkout has no experiments/.
        run: bash experiments/iterator_prefix/check_lean.sh
      - name: Replay oracle and kernel declarations with the official kernel
        # leanchecker replays every built module with each prefix against its
        # imported environment; it is not an independent verifier (#567).
        # scripts/replay_lean.sh bounds the replay's worker threads (#600).
        env:
          VASTITAS_REPLAY_THREADS: "4"
        run: |
          bash scripts/replay_lean.sh lean VastitasOracle
          bash scripts/replay_lean.sh lean VastitasKernel
      - name: Axiom-audit coverage, provenance and substitution regressions
        run: lake -d lean env python3 scripts/check_axiom_audit.py
      - name: Specification resolver regressions
        run: lake -d lean env python3 scripts/check_spec_lean.py
      - name: Core proof migration regressions
        run: cd lean && lake env lean -DwarningAsError=true ../scripts/check_oracle_core.lean
      - name: Finite edit acceptance indices
        run: cd lean && lake env lean -DwarningAsError=true ../scripts/check_edit_acceptance.lean
      - name: Dependency boundaries
        run: |
          lake -d lean update
          lake -d lean-kernel/native update
          lake -d lean-kernel/numerical update
          python3 scripts/check_boundaries.py
          git diff --exit-code -- lean/lake-manifest.json lean-kernel/lake-manifest.json lean-kernel/native/lake-manifest.json lean-kernel/numerical/lake-manifest.json
