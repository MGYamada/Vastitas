name: Mathematical bridge

on:
  push:
    paths:
      - 'lean-bridge/**'
      - 'lean-toolchain'
      - 'lean-kernel/lean-toolchain'
      # The implementation correspondence reads these kernel and Oracle sources.
      - 'lean-kernel/VastitasKernel/**'
      - 'lean-kernel/compiler-limits.json'
      - 'lean-kernel/lakefile.toml'
      # Differential/Accepted.lean reads the typed Core contract, and
      # Differential/ReverseCore.lean the compiled reverse Core of every public
      # path, whose imports reach most Oracle modules (#623).
      - 'lean/VastitasOracle/**'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/lean-toolchain'
      - 'scripts/check_boundaries.py'
      - 'scripts/test_check_boundaries.py'
      - 'scripts/install_ci_elan.py'
      - 'scripts/test_ci_bootstrap.py'
      - 'scripts/replay_lean.sh'
      - 'scripts/test_replay_lean.py'
      # The bridge claims of the specifications and their resolver (#647).
      - 'docs/spec/pins/bridge.json'
      - 'scripts/spec_resolve.lean'
      - '.github/workflows/lean-bridge.yml'
  pull_request:
    paths:
      - 'lean-bridge/**'
      - 'lean-toolchain'
      - 'lean-kernel/lean-toolchain'
      # The implementation correspondence reads these kernel and Oracle sources.
      - 'lean-kernel/VastitasKernel/**'
      - 'lean-kernel/compiler-limits.json'
      - 'lean-kernel/lakefile.toml'
      # Differential/Accepted.lean reads the typed Core contract, and
      # Differential/ReverseCore.lean the compiled reverse Core of every public
      # path, whose imports reach most Oracle modules (#623).
      - 'lean/VastitasOracle/**'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/lean-toolchain'
      - 'scripts/check_boundaries.py'
      - 'scripts/test_check_boundaries.py'
      - 'scripts/install_ci_elan.py'
      - 'scripts/test_ci_bootstrap.py'
      - 'scripts/replay_lean.sh'
      - 'scripts/test_replay_lean.py'
      # The bridge claims of the specifications and their resolver (#647).
      - 'docs/spec/pins/bridge.json'
      - 'scripts/spec_resolve.lean'
      - '.github/workflows/lean-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  daleckii-krein:
    name: Daleckii–Krein proof and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Retained source-workspace archives are replayed in their own job.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/experiments/source_workspace/results/*/evidence.zip
      - name: Dependency boundaries and regressions
        run: |
          python3 scripts/check_boundaries.py
          python3 -m unittest discover -s scripts -p 'test_check_boundaries.py'
      - name: Install checksum-pinned elan
        run: python3 scripts/install_ci_elan.py --destination "$RUNNER_TEMP/vastitas-elan"
      - name: Install the pinned Lean toolchain
        working-directory: lean-bridge
        run: lake --version
      - name: Fetch only the required Mathlib cache
        working-directory: lean-bridge
        run: |
          lake exe cache get \
            Mathlib.Analysis.CStarAlgebra.ContinuousFunctionalCalculus.Basic \
            Mathlib.Analysis.CStarAlgebra.ContinuousFunctionalCalculus.Continuity \
            Mathlib.Analysis.Calculus.DSlope \
            Mathlib.Analysis.Calculus.FDeriv.Mul \
            Mathlib.Analysis.Matrix.HermitianFunctionalCalculus \
            Mathlib.Data.Set.List \
            Mathlib.RingTheory.MvPolynomial.Groebner \
            Mathlib.RingTheory.MvPolynomial.MonomialOrder.DegLex \
            Mathlib.RingTheory.Ideal.Quotient.Operations \
            Mathlib.RingTheory.Localization.Away.Basic \
            Mathlib.AlgebraicGeometry.Scheme \
            Mathlib.AlgebraicGeometry.Pullbacks \
            Mathlib.Algebra.Category.Ring.Constructions \
            Mathlib.Analysis.CStarAlgebra.Matrix \
            Mathlib.Algebra.MvPolynomial.PDeriv \
            Mathlib.Analysis.Calculus.FDeriv.Prod \
            Mathlib.RingTheory.Kaehler.Polynomial \
            Mathlib.LinearAlgebra.Matrix.PosDef \
            Mathlib.LinearAlgebra.Matrix.NonsingularInverse \
            Mathlib.Algebra.Order.Star.Real
      - name: Build the mathematical bridge
        working-directory: lean-bridge
        run: lake build
      - name: Audit all bridge declarations and transitive axiom dependencies
        working-directory: lean-bridge
        run: lake env lean Audit.lean
      # Each pinned bridge theorem of docs/spec/: module, kind, axioms and
      # statement hash (#647).
      - name: Resolve the bridge claims of the specifications
        working-directory: lean-bridge
        env:
          VASTITAS_SPEC_INPUT: ../docs/spec/pins/bridge.json
        run: lake env lean -DwarningAsError=true ../scripts/spec_resolve.lean
      - name: Replay bridge proof declarations with the official kernel
        # leanchecker replays each module as a task holding its own Mathlib
        # environment; the runner bounds the worker threads (#600).
        env:
          VASTITAS_REPLAY_THREADS: "2"
        run: bash scripts/replay_lean.sh lean-bridge -v VastitasBridge
      - name: Recheck boundaries and dependency lockfiles
        run: |
          python3 scripts/check_boundaries.py
          git diff --exit-code -- lean-bridge/lake-manifest.json lean/lake-manifest.json lean-kernel/lake-manifest.json
