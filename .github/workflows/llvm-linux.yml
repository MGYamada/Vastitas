name: LLVM native qualification

on:
  pull_request:
    paths:
      - '.github/workflows/llvm-linux.yml'
      - '.github/actions/setup-*/**'
      - 'experiments/compiler_validation/llvm/**'
      - 'src/driver/llvm*.rs'
      - 'lean-kernel/VastitasKernel/LLVM/**'
      - 'lean-kernel/VastitasKernel/MidIR/**'
      - 'lean-kernel/native/storage.*'
      - 'llvm/**'
      - 'tests/llvm_*.rs'
      - 'tests/finite_binders.rs'
      - 'tests/finite_iso.rs'
      - 'tests/finite_monads.rs'
      - 'tests/finite_opposite.rs'
      - 'tests/numerical_realization.rs'
      - 'tests/numerical_source.rs'
      - 'tests/tree_source.rs'
      - 'lean-kernel/numerical/**'
      - 'examples/packages/numerical/**'
      - 'examples/packages/float-identity/**'
      - 'examples/packages/float-complex-identity/**'
      - 'monad/Vastitas.toml'
      - 'monad/src/**'
      - 'stdlib/Vastitas.toml'
      - 'stdlib/src/category/**'
      - 'tests/fixtures/FamilyComparison.vast'
      - 'scripts/build_openblas.py'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build.rs'
      - 'lean-toolchain'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: LLVM 23.1.4 static ABI and public integer programs (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            runner: ubuntu-24.04
            sdk: Linux-X64
            sha256: efdd1dbd089b99bfcfcde7b8eb1236163f2e88df5a981cca4f783ec9cb5e0378
            artifact: linux-x64
            timeout: 45
          - platform: macOS arm64
            runner: macos-latest
            sdk: macOS-ARM64
            sha256: 0f8b0db925ab54a63028d788e85b14abaa25492e9608819728c17f6786948da4
            artifact: macos-arm64
            # Static LLVM 23 bitcode is linked into each Rust test binary.
            timeout: 75
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/experiments/source_workspace/results/*/evidence.zip
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-elan
      - uses: ./.github/actions/setup-openblas
      - name: Install LLVM and Lean runtime link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libz3-dev libzstd-dev libxml2-dev libedit-dev libffi-dev libpfm4-dev zlib1g-dev libncurses-dev
      - name: Prepare archive tools and native link dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install gnu-tar zstd z3
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Verify and extract the pinned LLVM SDK
        working-directory: ${{ runner.temp }}
        env:
          LLVM_SDK: ${{ matrix.sdk }}
          LLVM_SDK_SHA256: ${{ matrix.sha256 }}
        run: |
          archive="LLVM-23.1.4-${LLVM_SDK}.tar.zst"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/$archive"
          echo "$LLVM_SDK_SHA256  $archive" | shasum -a 256 -c -
          mkdir llvm-sdk
          # Keep the LLVM libraries and headers used by llvm-sys. Excluding
          # unrelated tools and Clang libraries leaves room for the Lean kernel.
          # The upstream archive uses a 1 GiB zstd window.
          tar_tool=tar
          if [[ "$RUNNER_OS" == macOS ]]; then tar_tool=gtar; fi
          read_sdk() { zstd --decompress --stdout --memory=1024MB -- "$archive"; }
          read_sdk | "$tar_tool" -tf - | grep -E '(^|/)(bin/(llvm|llvm-config|llvm-dis|lld|ld64.lld)$|include/(llvm|llvm-c)/|lib(64)?/([^/]+/)?(libLLVM|libPolly|LLVMPolly))' > llvm-sdk-members.txt
          read_sdk | "$tar_tool" --no-recursion -xf - -C llvm-sdk -T llvm-sdk-members.txt
          rm -- "$archive"
          prefix=$(python3 -c 'from pathlib import Path; (config,) = Path("llvm-sdk").rglob("bin/llvm-config"); print(config.parent.parent.resolve())')
          test "$("$prefix/bin/llvm-config" --version)" = 23.1.4
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == macOS ]]; then
            # The upstream static archives contain LLVM 23 bitcode. The Xcode
            # driver knows the platform SDK, and the matching LLD reads that bitcode.
            "$prefix/bin/ld64.lld" --version | tee sdk-linker.txt
            grep -Fq 'LLD 23.1.4' sdk-linker.txt
            cat > llvm-sdk-linker <<'SH'
          #!/bin/sh
          exec /usr/bin/clang "-fuse-ld=$LLVM_SYS_231_PREFIX/bin/ld64.lld" "$@"
          SH
            chmod +x llvm-sdk-linker
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$RUNNER_TEMP/llvm-sdk-linker" >> "$GITHUB_ENV"
          fi
      - name: Qualify static LLVM, the Lean runtime and all four BLAS calls
        run: |
          python3 experiments/compiler_validation/llvm/run.py \
            --llvm-prefix "$LLVM_SYS_231_PREFIX" --lean-prefix "$(lean --print-prefix)" \
            --openblas-prefix "$RUNNER_TEMP/vastitas-openblas" --link-mode static \
            --allow-cargo-downloads --target-dir "$RUNNER_TEMP/llvm-target" \
            --output "$RUNNER_TEMP/llvm-qualification"
      - name: Exercise verified bytes and the public native compiler
        run: |
          lake -d lean-kernel build vastitas-kernel
          export CARGO_TARGET_DIR="$RUNNER_TEMP/llvm-target"
          cargo test --locked --manifest-path experiments/compiler_validation/llvm/Cargo.toml --test handoff
          cargo test --locked --features llvm-native --test llvm_preview --test llvm_package_roots --test finite_binders --test finite_iso --test finite_opposite --test numerical_realization
          cargo test --locked --features llvm-native --test finite_monads -- --test-threads=1 \
            | tee "$RUNNER_TEMP/llvm-qualification/kleisli-native.log"
          export VASTITAS_TEST_OPENBLAS_PREFIX="$RUNNER_TEMP/vastitas-openblas" VASTITAS_TEST_NATIVE_CC=cc
          cargo test --locked --features llvm-native --test numerical_source four_representations_execute_through_forwarded_public_maps -- --ignored --exact
          cargo test --locked --features llvm-native --test numerical_source physical_gemm_alpha_changes_the_computed_cells_on_the_llvm_route -- --ignored --exact
          cargo test --locked --features llvm-native --test tree_source tensor_column_contraction_executes_without_implicit_conjugation -- --ignored --exact
          python3 llvm/check_exact_native.py --frontend "$CARGO_TARGET_DIR/debug/vastitas" \
            --backend "$CARGO_TARGET_DIR/debug/vastitas-llvm-qualification" | tee "$RUNNER_TEMP/llvm-qualification/checked-integers.log"
      - name: Retain native and upstream comparison records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-native-${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/llvm-qualification/report.json
            ${{ runner.temp }}/llvm-qualification/authorized.ll
            ${{ runner.temp }}/llvm-qualification/*Comparison.ll
            ${{ runner.temp }}/llvm-qualification/checked-integers.log
            ${{ runner.temp }}/llvm-qualification/kleisli-native.log
            ${{ runner.temp }}/sdk-linker.txt
