name: OpenBLAS workspace observation

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'experiments/**'
      - 'src/**'
      - 'tests/**'
      - 'lean-kernel/**'
      - 'stdlib/**'
      - 'examples/**'
      - 'config/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'lean-toolchain'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'experiments/**'
      - 'src/**'
      - 'tests/**'
      - 'lean-kernel/**'
      - 'stdlib/**'
      - 'examples/**'
      - 'config/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'lean-toolchain'
  workflow_dispatch:
    inputs:
      profile:
        description: Source workload (streaming is a separate large-output cost record)
        type: choice
        options: [standard, streaming]
        default: standard

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: OpenBLAS workspace lifetimes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Eight backend/runtime configurations plus complete retained-record replay.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Validate Python without a loader override
        run: bash scripts/check_ci_python.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
      - name: Replay and mutation regressions
        run: |
          python3 -m unittest discover -s experiments/openblas_workspace -p 'test_*.py'
          python3 -m unittest discover -s experiments/openblas_packing -p 'test_*.py'
          python3 -m unittest discover -s experiments/source_workspace -p 'test_*.py'
      - name: Calibrate paired backends, workspace lifetimes and actual packing
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 experiments/openblas_packing/run.py --out "$RUNNER_TEMP/workspace-record" --build-dir "$RUNNER_TEMP/workspace-build" --jobs 4 --target HASWELL
          else
            python3 experiments/openblas_packing/run.py --out "$RUNNER_TEMP/workspace-record" --build-dir "$RUNNER_TEMP/workspace-build" --jobs 4
          fi
          VASTITAS_PACKING_RECORD="$RUNNER_TEMP/workspace-record" python3 -m unittest discover -s experiments/openblas_packing -p 'test_*.py'
      - name: Install checksum-pinned elan
        run: python3 scripts/install_ci_elan.py --destination "$RUNNER_TEMP/vastitas-elan"
      - name: Build the actual public source checker
        run: lake -d lean-kernel build vastitas-kernel
      - name: Calibrate the private Lean allocator variants
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libc++-dev libc++abi-dev
          fi
          python3 experiments/lean_allocation_diagnostic/run.py --out "$RUNNER_TEMP/lean-allocator-record"
      - name: Calibrate private Lean block lifetimes and peaks
        run: |
          python3 experiments/lean_allocation_lifetimes/run.py --out "$RUNNER_TEMP/lean-heap-record" --mimalloc-archive "$RUNNER_TEMP/lean-allocator-record/inputs/mimalloc-v3.4.5.tar.gz"
          VASTITAS_HEAP_LIFETIME_RECORD="$RUNNER_TEMP/lean-heap-record" python3 -m unittest discover -s experiments/lean_allocation_lifetimes -p 'test_*.py'
      - name: Observe source allocator, arenas, actual packing and call spans
        env:
          SOURCE_PROFILE: ${{ inputs.profile || 'standard' }}
        run: |
          cargo build --locked
          profile_args=()
          case "$SOURCE_PROFILE" in
            standard) ;;
            streaming) profile_args=(--streaming) ;;
            *) exit 2 ;;
          esac
          python3 experiments/source_workspace/run.py --prefix "$RUNNER_TEMP/workspace-build/stock" --diagnostic-prefix "$RUNNER_TEMP/workspace-build/diagnostic" --backend-record "$RUNNER_TEMP/workspace-record" --lean-record "$RUNNER_TEMP/lean-allocator-record" --lean-runtime-dir "$RUNNER_TEMP/lean-allocator-record/build" --heap-record "$RUNNER_TEMP/lean-heap-record" --heap-build-dir "$RUNNER_TEMP/lean-heap-record/build" --output "$RUNNER_TEMP/source-workspace-record" "${profile_args[@]}"
          python3 experiments/source_workspace/archive.py "$RUNNER_TEMP/source-workspace-record" "$RUNNER_TEMP/source-workspace-compact/evidence.zip"
          VASTITAS_SOURCE_ALLOCATOR_RECORD="$RUNNER_TEMP/source-workspace-compact/evidence.zip" VASTITAS_SOURCE_PACKING_RECORD="$RUNNER_TEMP/source-workspace-compact/evidence.zip" VASTITAS_SOURCE_HEAP_RECORD="$RUNNER_TEMP/source-workspace-compact/evidence.zip" python3 -m unittest discover -s experiments/source_workspace -p 'test_*.py'
      - name: Retain compact source workspace observation (no timings)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-workspace-${{ matrix.os }}-${{ github.event_name }}
          path: ${{ runner.temp }}/source-workspace-compact/
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain calibrated source backend (no timings)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-backend-calibration-${{ matrix.os }}-${{ github.event_name }}
          path: ${{ runner.temp }}/workspace-record/
          if-no-files-found: ignore
          retention-days: 30
