name: Public GEMM experiment

on:
  push:
    paths:
      - 'experiments/public_gemm/**'
      - 'experiments/plain_c/**'
      - 'experiments/native_cleanup.py'
      - 'scripts/native_sanitizers.py'
      - 'scripts/check_plain_c_baselines.py'
      - 'scripts/test_plain_c_measurements.py'
      - 'scripts/install_ci_elan.py'
      - 'scripts/check_ci_python.sh'
      - '.github/workflows/public-gemm-experiment.yml'
  pull_request:
    paths:
      - 'experiments/public_gemm/**'
      - 'experiments/plain_c/**'
      - 'experiments/native_cleanup.py'
      - 'scripts/native_sanitizers.py'
      - 'scripts/check_plain_c_baselines.py'
      - 'scripts/test_plain_c_measurements.py'
      - 'scripts/install_ci_elan.py'
      - 'scripts/check_ci_python.sh'
      - '.github/workflows/public-gemm-experiment.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Smoke validation or full exploratory measurement (not performance acceptance)'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.profile || 'smoke' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  GOTO_NUM_THREADS: '1'
  GEMM_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}

jobs:
  experiment:
    name: Public GEMM experiment (Linux, ${{ inputs.profile || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Validate Python without a loader override
        run: bash scripts/check_ci_python.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
      - name: Install checksum-pinned elan
        run: python3 scripts/install_ci_elan.py --destination "$RUNNER_TEMP/vastitas-elan"
      - name: Build the independent kernel
        run: lake -d lean-kernel build vastitas-kernel
      - name: Build pinned sequential LP64 OpenBLAS
        run: python3 scripts/build_openblas.py --prefix "$RUNNER_TEMP/gemm-openblas" --jobs 4 --target HASWELL
      - name: Build frontend and check the harness
        run: |
          cargo build --release --locked
          python3 -m unittest discover -s scripts -p 'test_plain_c_measurements.py'
          python3 experiments/public_gemm/test_harness.py
      - name: Validate generated, arena-C and plain-C output/cost contracts
        run: |
          case "$GEMM_PROFILE" in
            smoke) profile_args=(--smoke --samples 6 --target-ms 0.1) ;;
            full) profile_args=(--samples 12 --target-ms 5) ;;
            *) echo "Unsupported GEMM profile: $GEMM_PROFILE" >&2; exit 2 ;;
          esac
          python3 experiments/public_gemm/run.py \
            --prefix "$RUNNER_TEMP/gemm-openblas" \
            --output "$RUNNER_TEMP/public-gemm-results" \
            "${profile_args[@]}"
          cat "$RUNNER_TEMP/public-gemm-results/status.json"
      - name: Retain experiment diagnostics (not performance acceptance)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-gemm-${{ env.GEMM_PROFILE }}-${{ github.event_name }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/public-gemm-results/*.json
            ${{ runner.temp }}/public-gemm-results/*.md
            ${{ runner.temp }}/public-gemm-results/*.csv
            ${{ runner.temp }}/public-gemm-results/cases/**/Generated.lean
            ${{ runner.temp }}/public-gemm-results/cases/**/Main.lean
            ${{ runner.temp }}/public-gemm-results/cases/**/response.json
            ${{ runner.temp }}/public-gemm-results/cases/**/case.h
            ${{ runner.temp }}/public-gemm-results/cases/**/*-symbols.txt
            ${{ runner.temp }}/public-gemm-results/cases/**/symbols.txt
            ${{ runner.temp }}/public-gemm-results/cases/**/disassembly.txt
            ${{ runner.temp }}/public-gemm-results/cases/**/linked-libraries.txt
            ${{ runner.temp }}/public-gemm-results/cases/**/package/**
            ${{ runner.temp }}/public-gemm-results/source/**
