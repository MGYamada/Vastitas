name: Tensor packing experiment

on:
  push:
    # Heavy OpenBLAS observations run on main and on demand, not on every PR (#571).
    branches: [main]
    paths:
      - '.github/actions/setup-python/**'
      - '.github/actions/setup-rust/**'
      - '.github/actions/setup-openblas/**'
      - '.github/actions/run-numerical-experiment/**'
      - 'experiments/tensor_packing/**'
      - 'src/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'lean-toolchain'
      - 'lean-kernel/**'
      - 'scripts/build_openblas.py'
      - 'experiments/storage_copy/run.py'
      - 'experiments/plain_c/**'
      - 'experiments/native_cleanup.py'
      - 'scripts/native_sanitizers.py'
      - 'scripts/kernel_protocol.py'
      - 'scripts/check_plain_c_baselines.py'
      - 'scripts/test_plain_c_measurements.py'
      - '.github/actions/setup-elan/**'
      - 'scripts/install_ci_elan.py'
      - 'scripts/check_ci_python.sh'
      - '.github/workflows/tensor-packing-experiment.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Smoke validation or full exploratory measurement (not performance acceptance)'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.profile || 'smoke' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  GOTO_NUM_THREADS: '1'
  TENSOR_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}

jobs:
  experiment:
    name: Tensor packing experiment (Linux, ${{ inputs.profile || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Retained source-workspace archives are replayed in their own job.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/experiments/source_workspace/results/*/evidence.zip
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-elan
      - name: Build the independent kernel
        run: lake -d lean-kernel build vastitas-kernel
      - uses: ./.github/actions/setup-openblas
      - name: Build frontend and check the harness
        run: |
          cargo build --release --locked
          python3 -m unittest discover -s scripts -p 'test_plain_c_measurements.py'
          python3 experiments/tensor_packing/test_harness.py
      - name: Validate generated, arena-C and plain-C output/cost contracts
        uses: ./.github/actions/run-numerical-experiment
        with:
          harness: experiments/tensor_packing/run.py
          profile: ${{ env.TENSOR_PROFILE }}
          results: tensor-packing-results
      - name: Retain compact source, validation and measurement records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensor-packing-records-${{ env.TENSOR_PROFILE }}-${{ github.event_name }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/tensor-packing-results/*.json
            ${{ runner.temp }}/tensor-packing-results/*.md
            ${{ runner.temp }}/tensor-packing-results/*.csv
            ${{ runner.temp }}/tensor-packing-results/cases/**/Generated.lean
            ${{ runner.temp }}/tensor-packing-results/cases/**/Main.lean
            ${{ runner.temp }}/tensor-packing-results/cases/**/response.json
            ${{ runner.temp }}/tensor-packing-results/cases/**/case.h
            ${{ runner.temp }}/tensor-packing-results/cases/**/*-symbols.txt
            ${{ runner.temp }}/tensor-packing-results/cases/**/linked-libraries.txt
            ${{ runner.temp }}/tensor-packing-results/cases/**/package/**
            ${{ runner.temp }}/tensor-packing-results/source/**
      - name: Retain large generated-code inspection files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensor-packing-inspection-${{ env.TENSOR_PROFILE }}-${{ github.event_name }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/tensor-packing-results/cases/**/symbols.txt
            ${{ runner.temp }}/tensor-packing-results/cases/**/disassembly.txt
