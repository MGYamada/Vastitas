[package]
name = "vastitas"
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.99.1"
description = "The Vastitas compiler"
license = "Apache-2.0"
repository = "https://github.com/MGYamada/Vastitas"
readme = "README.md"
include = [
    "/src/", "/build.rs", "/Cargo.lock", "/README.md", "/LICENSE",
    "/config/nanoda-internal-audit.json", "/rust-toolchain.toml", "/lean-toolchain",
    "/lean-kernel/", "!**/.lake/", "/tests/", "/examples/",
    "/scripts/check_nanoda_vendor.py", "/stdlib/src/", "/stdlib/Vastitas.toml", "/stdlib/README.md", "/scripts/build_stdlib_package.py",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
toml = "0.8"
semver = "1"
# Dependencies of the bundled nanoda_lib 0.4.31 export checker.
indexmap = "2.13.0"
rustc-hash = "1.1.0"
num-bigint = { version = "0.5.1", features = ["serde"] }
num-integer = "0.1.47"
num-traits = "0.2.19"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "vastitas"
path = "src/main.rs"
