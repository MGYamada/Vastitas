[package]
name = "vastitas"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "The Vastitas Stage 0 compiler"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
nix = { version = "0.29", features = ["signal", "process"] }

[[bin]]
name = "vastitas"
path = "src/main.rs"
