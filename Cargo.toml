[package]
name = "vastitas"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "The Vastitas compiler"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
toml = "0.8"
semver = "1"
nanoda_lib = { git = "https://github.com/ammkrn/nanoda_lib", rev = "8de7e0c4ed3052745a7f8725164efd9e76d84c56" }

[build-dependencies]
serde_json = "1"

[[bin]]
name = "vastitas"
path = "src/main.rs"
