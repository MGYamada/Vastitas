[package]
name = "vastitas"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "The Vastitas compiler"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
nix = { version = "0.29", features = ["signal", "process"] }
toml = "0.8"
semver = "1"

[[bin]]
name = "vastitas"
path = "src/main.rs"
