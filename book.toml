[book]
title = "Vastitas Programming Language"
authors = ["Vastitas Project Contributors"]
description = "Guide and reference for Vastitas, a language whose mathematical programs are checked in full before they compile to native executables"
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

[preprocessor.katex]
after = ["links"]
output = "mathml"
no-css = true
throw-on-error = true

[output.html]
git-repository-url = "https://github.com/MGYamada/Vastitas"
# Keep the local review build portable until a publication base path is chosen.
input-404 = ""

[output.html.playground]
runnable = false

# Retired chapters. Each anchor of a retired page leads to the section that
# holds its rules; scripts/check_book.py checks every target.
[output.html.redirect]
"/stage0.html" = "language/programs.html"
"/stage0.html#surface-language" = "language/functions.html"
"/stage0.html#scalars" = "language/types.html#scalar-types"
"/stage0.html#geometric-core" = "language/geometric-types.html"
"/stage0.html#compiler-behavior-and-limits" = "appendix/limits.html"
"/stage0.html#source-libraries" = "language/programs.html#flat-mode"
