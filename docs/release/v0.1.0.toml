[[issue]]
number = 749
title = "Compiler specification and feasibility"
state = "open"
depends = []
remaining = "Official Lean and nanoda checked the same 1,000-operation reduction exports on Linux x86-64 and macOS arm64. Both single-chunk and 64-operation chunk timings and peak RSS are recorded. The native ABI fixture linked the pinned LLVM, Lean and all four OpenBLAS calls on both platforms. On Linux x86-64 and macOS arm64 the public compiler matched 121 integer results, 15 heap ownership probes and four executable exits. Both hosts ran the four public map representations and the tensor column contraction. Production coverage, offline distribution and compiler child issues remain. [Two-host CI qualification](https://github.com/MGYamada/Vastitas/actions/runs/44871839008)"

