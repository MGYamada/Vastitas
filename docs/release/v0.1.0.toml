[[issue]]
number = 749
title = "Compiler specification and feasibility"
state = "open"
depends = []
remaining = "Official Lean and nanoda checked the same 1,000-operation reduction exports on Linux x86-64 and macOS arm64. Both single-chunk and 64-operation chunk timings and peak RSS are recorded. The macOS native ABI fixture passed. The Linux native run, production coverage and compiler child issues remain."

[[issue]]
number = 839
title = "Public type vocabulary"
state = "complete"
depends = []
remaining = "Normative names only; executable widths have separate owners."

[[issue]]
number = 462
title = "Static fn families"
state = "open"
depends = []
remaining = "The revision records every loaded manifest and source file, the selected family, key, contribution and Core symbol. A library or dependency-manifest edit invalidates replay even if the complete LLVM module stays identical. Closed Nat/Int arithmetic reaches complete LLVM bytes with the ordered canonical operator keys and sole protected methods checked. Boxed functions retain the operator sites for runtime arguments. A linked integer executable checks its direct calls and every operator site in the same revision. Swapping the operands of named mixed division selects the other ABI and invalidates the previous revision. A selected Bool method can pass through a function returning Fn. Two specializations then call that method and a lambda in the same native module. More general method bodies, argument types and module shapes remain."

[[issue]]
number = 455
title = "Structured assemble"
state = "open"
depends = [462]
remaining = "Lean reads the edit commands from the submitted entry bytes, compares the complete structured trace and original brace spans, and checks the selected method against the saved revision. The sealed forwarding library and an assembled Bool family reach complete LLVM bytes. The assembled family preserves the selected and nonselected bodies. A three-axis lookup and a nullary table feed a selected negation and disjunction. Changing the row invalidates the revision. One source revision reproduces the macOS arm64 and x86-64 Linux modules. Editing either method invalidates that revision on both targets. Explicitly sealing a dependency family retains its emitted siblings, including applied implementations from another package, even with no calls. An assembled integer entry retains both arithmetic methods and returns 42 through the selected addition. Substituting the other definition and Core symbol in the same family fails revision replay. The [cross-package corpus example](https://github.com/MGYamada/Vastitas/blob/main/llvm/src/borrowed-operator.ll) binds six physical inputs and all 2,051 bytes in Official and Fast stage certificates. The macOS arm64 executable and Lean control return 42. An uncalled sealed integer family retains all five method specializations beside the entry, including the contribution and its four fallback bodies. The [LLVM file](https://github.com/MGYamada/Vastitas/blob/main/llvm/src/uncalled-operator.ll) has 1,829 bytes and its entry returns 7. Changing a fallback body invalidates the revision. Broader downstream methods and module shapes remain."

[[issue]]
number = 762
title = "Finite edition 2026"
state = "open"
depends = [462, 455]
remaining = "Edition 2026 admits category-indexed functions, named finite functors, natural transformations, isomorphisms, selected Monads and the canonical `F32<RR>` and `F64<RR>` identity realizations on a smooth affine standard chart. Public tensor views cover ranks one through three, including a rank-one contraction boundary. Further finite schemas, complex chart realizations and Affine wrappers remain."

