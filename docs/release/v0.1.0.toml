[[issue]]
number = 462
title = "Static fn families"
state = "open"
depends = []
remaining = "The revision records every loaded manifest and source file, the selected family, key, contribution and Core symbol. A library or dependency-manifest edit invalidates replay even if the complete LLVM module stays identical. Closed Nat/Int arithmetic reaches complete LLVM bytes with the ordered canonical operator keys and sole protected methods checked. Boxed functions retain the operator sites for runtime arguments. A linked integer executable checks its direct calls and every operator site in the same revision. Swapping the operands of named mixed division selects the other ABI and invalidates the previous revision. A selected Bool method can pass through a function returning Fn. Two specializations then call that method and a lambda in the same native module. The compiler folds full-width literal equality and inequality inside parameterized methods. A checked edition 2026 example retains both assembled bodies. Editing either integer invalidates revision replay even when all 924 LLVM bytes stay identical. Lean replays the defining methods of every accepted dispatch family and the complete source of each ordinary singleton, including unused functions and flat libraries. Explicit domains, bodyless contracts and inferred headers are checked in their declaring scope. Pair-valued methods and ordinary calls preserve both element sorts and ordered projections in the boxed ABI. Removing the applied contribution or editing its unselected sibling invalidates the saved revision. For each exact integer operator site the revision records the sole family method's ordinal and Core result type. More general LLVM method bodies, argument types and module shapes remain."

[[issue]]
number = 455
title = "Structured assemble"
state = "open"
depends = [462]
remaining = "Lean reads the edit commands from the submitted entry bytes, compares the complete structured trace and original brace spans, and checks the selected method against the saved revision. The checker matches grant, delegation, transfer and contribution declarations to physical files in all selected packages, including unused declarations, method signatures and body spans. The sealed forwarding library and an assembled Bool family reach complete LLVM bytes. The assembled family preserves the selected and nonselected bodies. A three-axis lookup and a nullary table feed a selected negation and disjunction. Changing the row invalidates the revision. One source revision reproduces the macOS arm64 and x86-64 Linux modules. Editing either method invalidates that revision on both targets. Explicitly sealing a dependency family retains its emitted siblings, including applied implementations from another package, even with no calls. An assembled integer entry retains both arithmetic methods and returns 42 through the selected addition. Substituting the other definition and Core symbol in the same family fails revision replay. The [cross-package corpus example](https://github.com/MGYamada/Vastitas/blob/main/llvm/src/borrowed-operator.ll) binds six physical inputs and all 2,051 bytes in Official and Fast stage certificates. The macOS arm64 executable and Lean control return 42. An uncalled sealed integer family retains all five method specializations beside the entry, including the contribution and its four fallback bodies. The [LLVM file](https://github.com/MGYamada/Vastitas/blob/main/llvm/src/uncalled-operator.ll) has 1,829 bytes and its entry returns 7. Changing a fallback body invalidates the revision. The public checker replays the complete syntax of defining and contributed family bodies against their physical files, including uncalled fallbacks and unapplied contributions. Written imports resolve each assembled family at its original file and span. Two aliases of the same dependency can produce identical LLVM bytes, while mixing either input with the other import fails. A change to the written selector order changes which contributed method wins for the same Bool key. Both native executables agree with the Lean/C controls on exits 42 and 7. Substituting the other decoded hierarchy fails all five kernel routes at the original declaration. The defining, contributing and assembling package identities also match the names and versions in their respective manifests. A pair-returning family keeps both bodies in one linked LLVM module. The selected contribution and its default method produce distinct full-width integer results. Broader downstream LLVM lowering and module shapes remain."

[[issue]]
number = 762
title = "Finite edition 2026"
state = "open"
depends = [462, 455]
remaining = "Edition 2026 admits category-indexed functions, named finite functors, natural transformations, isomorphisms, named Opposite views, selected Monads and the canonical `F32<RR>` and `F64<RR>` identity realizations on a smooth affine standard chart. Public tensor views cover ranks one through three, including a rank-one contraction boundary. Named exact real and complex meadows and their mathematical standard affine charts are admitted. Both widths execute the identity on a named exact complex affine. Fresh Affine identities execute at all four representations. Lean checks module item boundaries and the keyword, name, owner, visibility and extent of every indexed declaration. Lean replays finite carriers, tables, schemas and named instances in the files that declare them. This includes unused tables, row extents, selected Monad fields and associated paths. Lean replays finite-indexed function binders, nominal schemas, signatures and bodies, including uncalled functions. Ordinary singletons replay their signatures, bodies and observed initializers at their original source tokens. Lean checks every use and each declared module against its declaring file, including re-exports and empty modules. Each file-backed package has one public root carrying the exact span of the first token or EOF in its assigned source file. Every abstract selector and concrete membership replays its qualified paths and spans against its physical declaration. For each file-backed package, Lean reads the edition, name and version at its manifest path and checks the owner used by FunctionId. Physical manifest replay tracks tables introduced by headers, dotted keys and inline values. Reopening a sealed table invalidates the request before revision and LLVM publication. The boxed certificate driver resolves every external module from its declaration and compares its canonical path with the corresponding physical file occurrence. Presented and smooth affine declarations replay their ordered coordinates, relations and substitutions from the file that defines them. Typed morphisms replay their family, endpoints and written graph, including the explicit identity used by numerical interpretation. Resource allocation, transfer, borrow and cleanup replay their physical names, representations and layouts. Runtime extents retain their slot names or literal values. Resource functions replay their parameter and result types, empty and populated branch guards, typed bindings, calls and final results, including in uncalled functions. Static and runtime numerical views replay their nominal roles, physical input loans, Gram entries, and workspace layouts. Tensor views and contraction plans replay their groupings, graph ports, borrow layouts and ordered joins. Each indexed global also replays its selected implementation path. Affine isomorphisms and Cartesian squares replay their ordered morphisms and fiber at the written path spans. Implementations bind the marker, all five representations and capability order. Classifications bind the ordered parent and domain paths. Indexed families bind the ordered parameter kinds and paths, the representation and each constraint slot. Each indexed package binds its ordered witness cases, fields, family paths and bound indices to the checked Core package table. The independently resolved entries occur in the returned Core, including for unused declarations. When the boxed emitter publishes a module, the certificate also identifies both MidIR environments, the function revision and every LLVM byte for those source files. All 47 primitive families replay their operands. The original owner selects the same elaborated binding in the final Core. Gram rows, evidence subjects and frame columns with their inverse replay against the physical source. The same elaborated value is present in Core and in both MidIR environments of a published integer module. All 54 indexed body constructors have physical operand checks. The source owner selects each completed indexed value in elaboration and returned Core. The two MidIR environments of a published boxed module preserve the same lookup. Whole-edition acceptance still requires the remaining source-to-executable mappings for the finite profiles."

[[issue]]
number = 533
title = "Single wire epoch"
state = "open"
depends = [762]
remaining = "Static and runtime GEMM and both vector evaluations replay each written operand and named coefficient. The physical count of immediate statements in each branch arm matches the decoded list, including nested and unselected arms. Literal cell operations replay against physical source in both arms and in uncalled functions. Lean checks precision and each real or complex component before generating the storage calls. Canonical resource realization calls are checked against the physical source, including precision, lexical owner, branch conditions, statement order and original path spans. Defining and contributed family method bodies are checked against physical source down to operators, grouping, nominal type paths and original node spans. Lean compares physical affine polynomials with the decoded trees before normalization. Token mismatches retain the physical byte range and file-local coordinates. Other source-to-Core and resource correspondence evidence remains."

[[issue]]
number = 756
title = "Finite carriers and named instances"
state = "open"
depends = [462, 762]
remaining = "Public finite carriers, total tables, composable-pair tables and named category instances are checked. Concrete Hom, total lookup and dependent composition run on the checked Lean backend. Category functions specialize over their model and endpoints. A named functor selects its source, target and both nominal tables for ordinary functions. Natural transformations and selected Monads supply checked component projections. More finite-indexed operations and whole-module correspondence remain."

[[issue]]
number = 199
title = "Category and mathematical Monad"
state = "open"
depends = [756]
remaining = "Checked categories satisfy identity and associativity. Checked functors preserve both endpoints, identities and composition for all composable pairs. The named transformations and selected Monad laws hold on the checked tables. The accepted Monad yields both Kleisli identities and associativity. Its derived extension triple recovers the same unit, multiplication and action on the checked table rows. Named isomorphisms expose both endpoint-typed arrows. The public checker proves both inverse equations. The two-object groupoid runs both compositions. The lazy Opposite shares the graph and reverses both endpoints and composition. Inversion on S3 satisfies the ordinary functor laws with the opposite as its source. Whole-package verification remains."

[[issue]]
number = 206
title = "Operational Kleisli"
state = "open"
depends = [199]
remaining = "The optional monad::kleisli package exports both derived views and five ordinary functions. Each view selects a named std::category::Monad. The five canonical template specializations evaluate to the selected mathematical operations. The S3 executable distinguishes opposite argument orders. The public LLVM preview compiles the whole closure example. Its macOS arm64 executable returns 0. Selecting extend through the triple in a second entry produces 5,326 LLVM bytes and exit 42. The noncommuting S3 example returns 42 through the same path. An ordinary function may take a capture-free Fn returning a nominal Hom and call it to supply bind with an arrow. The two-arrow callback fixture has 2,434 checked LLVM bytes and distinguishes both producer results on macOS arm64. The direct bind(p, k) fixture has 2,456 checked LLVM bytes. The executable-pass theorem identifies the ordered producer calls in the returned Core, and the S3 test exercises both callable positions of compose. The public LLVM build executes the closure program on Linux x86-64 and macOS arm64, with each exit edge selected in turn. The native matrix exercises both producer results with explicit invocation and direct forwarding, noncommuting S3 order and two Monads on one functor. Release verification modes remain open."

[[issue]]
number = 757
title = "Exact complex model"
state = "open"
depends = []
remaining = "The Oracle constructs the rational Cauchy quotient RR, pairs it to form CC, and embeds QQ(i) injectively. The Oracle proves the commutative-ring reduct and separate IsField proposition for both selected meadows. The Bridge proves that both carrier equivalences preserve addition, multiplication and totalized inversion, and gives the rational-coordinate interpretation. The QQ(i) embedding preserves multiplication, conjugation and totalized inversion. Edition 2026 checks the named real carrier, its meadow, the paired carrier and the complex meadow. A nominal affine object selects that exact model and an ordered standard chart. The checked complex standard chart supports identity copies at both widths. Public QQ(i) point constructions and more general numerical realizations remain."

[[issue]]
number = 758
title = "Fixed-order numerical references"
state = "open"
depends = []
remaining = "Lean models binary32/64 rounding, special values, flags and fixed-order kernels. The real zero-divisor and empty-dot laws are proved. On 828 tuples the independent references agree on scalar and complex bits and flags. C real division, complex division and inverse match the native observation for both widths and permitted aliases. The production one-cell dot adapter matches 948 Lean cases across all four representations. Zero alpha and zero beta have independent input and prior-destination irrelevance proofs. For related non-NaN operands Lean proves the one-operation observation and all five flags for four real arithmetic operations, and proves equality and order observations. The checked guard with product recovery gives the same real division at every bit pattern. Diagonal kernel differentials and public arithmetic integration remain."

[[issue]]
number = 318
title = "Numerical execution"
state = "open"
depends = [758]
remaining = "The NativeFast identity at both RR and CC precisions executes with explicit resource points and Unavailable flags. The Lean reference proves raw and checked sequencing, lift, trace projection and the signed-zero guard. Public arithmetic calls with exact argument and return bits remain."

[[issue]]
number = 686
title = "Numerical realizations"
state = "open"
depends = [757, 318, 762]
remaining = "The canonical protected realize, interpret, point and run operations execute a declared real affine identity on its own standard chart into checked `F32<RR>` or `F64<RR>` storage. The point proof identifies the allocation and its exact representation. A named exact complex affine supports identity copies in `F32<CC>` and `F64<CC>`. Its receipt binds the selected carrier and both meadows. The four identity copies execute through the checked LLVM preview on Linux x86-64 and macOS arm64. The four fresh Affine wrappers use the same checked realization and identity copy. Further numerical graphs and full profile selection remain."

[[issue]]
number = 689
title = "Tensor aliases"
state = "open"
depends = []
remaining = "Four public source-to-GEMM paths preserve the allocation precision through calls and execute with both the LLVM preview and Lean/C. The storage adapter exercises 16 orientations per representation. Rank-one tensor columns share coordinates with vector views, and matrix-column contraction checks both the dual and surviving bases. The binary32 complex matrix-column join passes both input conjugation flags as false. An independently constructed storage schedule prints all 3,350 retained LLVM bytes; the public compiler reproduces the module from its tensor source. The exact finite-free tensor aliases, LinearMap interpretation and rank-three LLVM lowering remain."

[[issue]]
number = 750
title = "Phase-indexed MidIR"
state = "open"
depends = []
remaining = "The inventory tracks 612 constructors. For Unit, Bool, Nat and Int literals, the actual builder appends a nullary instruction and returns its SSA slot. Both phase denotations agree with the Core evaluator. CI compares fourteen instruction rows and five structural mappings with the compiled Lean proofs, including the physical operands of rank-three packing and regrouping. Conditional lowering connects both checked arms to one typed join. The linked parameter selection theorem returns the full integer at each call depth. Variable references, scopes, ascriptions and let bindings preserve the builder state transitions and Core evaluation under the stated slot premises. For a typed local initialized from a parameter and returned directly, both whole MidIR functions match the direct return. An ordinary function and both methods of an assembled family produce identical LLVM bytes under that change. The previous function revision fails replay. Finite tags resolve in their declared carrier or Hom fiber. Lookup instructions preserve the table and ordered operands. Explicit Nat-to-Int conversion consumes the operand’s SSA reference. The retained method returns the same unbounded integer in Core and both MidIR invokers for every natural. For static calls, the builder retains argument order and the selected target. Both phase invokers preserve the call under the callee-body premise, which is discharged for the two-parameter Int subtraction shape. The ordered pair constructor and field projection cover both integer types. A linked projection method agrees with Core for every input. Unary operators cover Boolean negation, boxed integer negation and exact signed literals. Linked parameter negation agrees in Core and both MidIR invokers. The binary constructor preserves the actual operand evaluation order and every admitted integer, Boolean and finite signature across both phases. The other 595 constructors await local mapping and release disposition. The typed pure MidIR fragment distinguishes Unit from Bool, preserves arbitrary-size Int literals and checks direct calls by symbol, family, specialization and nominal ABI. For static resource entries, linear effect tokens preserve the logical schedule and resolved physical calls. General control flow and full accepted-module coverage remain."

[[issue]]
number = 751
title = "Closed opcode registry"
state = "open"
depends = [750]
remaining = "The closed pure fragment includes Boolean conjunction, disjunction and negation, finite tags, arbitrary-arity nominal lookup, branches and checked direct calls. Nat/Int literals, same-kind arithmetic, mixed division, negation and conversion retain their ordered signatures. Construction and both projections preserve the element sort and order for homogeneous Nat and Int pairs. The registry distinguishes instruction mappings from the five structural forms, which need no opcode. Static storage opcodes bind allocation and view operands, component tags and exact payloads. All six dynamic Nat and Int comparison signatures have MidIR denotations. Straight-line library comparisons borrow both integers and return a 32-bit Boolean through the shim. Branches on those results in hosted boxed programs, dynamic resource plans and numerical arithmetic still need release evidence."

[[issue]]
number = 752
title = "Translation validation"
state = "open"
depends = [751]
remaining = "Unary lookup, binary nominal lookup and S3 composition, a forwarding caller, literal and folded Int entries, and an assembled Boolean family have complete LLVM-byte correspondence. For a folded entry the proof ties the full integer, ordered canonical operator keys and current revision to both MidIR phases. The Opt-to-Exec theorem covers linked calls at every depth. For a single boxed integer library both phases and the parsed calls give the same return observation under the runtime contract. Static storage entries bind the checked plan and both phase schedules to the parsed LLVM bytes. Their modeled first-failure and normal exits preserve arena cleanup. General module witnesses, branches and reverse observations remain."

[[issue]]
number = 282
title = "Fast and Official modes"
state = "open"
depends = [752]
remaining = "Official replay of 32 named modules proves the concrete public emission of the signed literal fixture, including source identity, revision, returned Core, both MidIR observations, all 374 LLVM bytes and exit 255. An offline nanoda run checked the revision-bound signed-literal theorem with 29,374 declarations against an independently provisioned reference. The [qualification](https://github.com/MGYamada/Vastitas/tree/main/experiments/compiler_validation/official_exit) records its verifier and resource limits. A live boxed-program stage certificate binds the current revision, decoded physical files, graph, integer and every LLVM byte in Official and Fast. Public CLI modes, per-build source admission and coverage of additional artifacts remain."

