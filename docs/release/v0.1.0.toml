[[issue]]
number = 756
title = "Finite carriers and named instances"
state = "open"
depends = [462, 762]
remaining = "Public finite carriers, total tables, composable-pair tables and named category instances are checked. Concrete Hom, total lookup and dependent composition run on the checked Lean backend. Category functions specialize over their model and endpoints. A named functor selects its source, target and both nominal tables for ordinary functions. Natural transformations and selected Monads supply checked component projections. More finite-indexed operations and whole-module correspondence remain."

[[issue]]
number = 199
title = "Category and mathematical Monad"
state = "open"
depends = [756]
remaining = "Checked categories satisfy identity and associativity. Checked functors preserve both endpoints, identities and composition for all composable pairs. The named transformations and selected Monad laws hold on the checked tables. The accepted Monad yields both Kleisli identities and associativity. Its derived extension triple recovers the same unit, multiplication and action on the checked table rows. Named isomorphisms expose both endpoint-typed arrows. The public checker proves both inverse equations. The two-object groupoid runs both compositions. The lazy Opposite view remains."

[[issue]]
number = 206
title = "Operational Kleisli"
state = "open"
depends = [199]
remaining = "The optional monad::kleisli package exports both derived views and five ordinary functions. Each view selects a named std::category::Monad. The five canonical template specializations evaluate to the selected mathematical operations. The S3 executable distinguishes opposite argument orders. The public LLVM preview compiles the whole closure example. Its macOS arm64 executable returns 0. Selecting extend through the triple in a second entry produces 5,326 LLVM bytes and exit 42. The noncommuting S3 example returns 42 through the same path. An ordinary function may take a capture-free Fn returning a nominal Hom and call it to supply bind with an arrow. The two-arrow callback fixture has 2,434 checked LLVM bytes and distinguishes both producer results on macOS arm64. The direct bind(p, k) fixture has 2,456 checked LLVM bytes. The executable-pass theorem identifies the ordered producer calls in the returned Core, and the S3 test exercises both callable positions of compose. Linux qualification and release verification modes remain."

[[issue]]
number = 757
title = "Exact complex model"
state = "open"
depends = []
remaining = "The Oracle constructs the rational Cauchy quotient RR, pairs it to form CC, and embeds QQ(i) injectively. The Oracle proves the commutative-ring reduct and separate IsField proposition for both selected meadows. The Bridge proves that both carrier equivalences preserve addition, multiplication and totalized inversion, and gives the rational-coordinate interpretation. The QQ(i) embedding preserves multiplication, conjugation and totalized inversion. Source-level model identity, revision and public affine chart correspondence remain."

[[issue]]
number = 758
title = "Fixed-order numerical references"
state = "open"
depends = []
remaining = "Lean models binary32/64 rounding, special values, flags and fixed-order kernels. The real zero-divisor and empty-dot laws are proved. The C quotient and inverse adapters agree on 828 input tuples. Full kernel differentials, reference laws and public arithmetic integration remain."

[[issue]]
number = 318
title = "Numerical execution"
state = "open"
depends = [758]
remaining = "The NativeFast identity at both RR precisions executes with explicit resource points and Unavailable flags. The Lean reference proves raw and checked sequencing, lift, trace projection and the signed-zero guard. Public arithmetic calls with exact argument and return bits remain."

[[issue]]
number = 686
title = "Numerical realizations"
state = "open"
depends = [757, 318, 762]
remaining = "The canonical protected realize, interpret, point and run operations execute a declared real affine identity on its own standard chart into checked `F32<RR>` or `F64<RR>` storage. The point proof identifies the allocation and its exact representation. Complex chart subjects, further numerical graphs, full profile selection and the four Affine wrappers remain."

[[issue]]
number = 689
title = "Tensor aliases"
state = "open"
depends = []
remaining = "Four public source-to-GEMM paths preserve the allocation precision through calls and execute via Lean/C. The storage adapter exercises 16 orientations per representation. Rank-one tensor columns share coordinates with vector views, and matrix-column contraction checks both the dual and surviving bases. The exact finite-free tensor aliases, LinearMap interpretation and checked LLVM lowering remain."

[[issue]]
number = 750
title = "Phase-indexed MidIR"
state = "open"
depends = []
remaining = "The inventory tracks 590 constructor entries, all awaiting a release disposition. The typed pure MidIR fragment distinguishes Unit from Bool, preserves arbitrary-size Int literals and checks direct calls by symbol, family, specialization and nominal ABI. Full accepted-module coverage and ordered resource effects remain."

[[issue]]
number = 751
title = "Closed opcode registry"
state = "open"
depends = [750]
remaining = "The closed pure fragment includes Boolean conjunction, disjunction and negation, finite tags, arbitrary-arity nominal lookup, branches and checked direct calls. Nat/Int literals, same-kind arithmetic, mixed division, negation and conversion retain their ordered signatures. Comparisons, resources and numerical opcodes still need their full profile."

[[issue]]
number = 752
title = "Translation validation"
state = "open"
depends = [751]
remaining = "Unary lookup, binary nominal lookup and S3 composition, a forwarding caller, literal and folded Int entries, and an assembled Boolean family have complete LLVM-byte correspondence. For a folded entry the proof ties the full integer, ordered canonical operator keys and current revision to both MidIR phases. The Opt-to-Exec theorem covers linked calls at every depth. For a single boxed integer library both phases and the parsed calls give the same return observation under the runtime contract. General module witnesses, effects and cleanup remain."

[[issue]]
number = 282
title = "Fast and Official modes"
state = "open"
depends = [752]
remaining = "Official replay of 32 named modules proves the concrete public emission of the signed literal fixture, including source identity, revision, returned Core, both MidIR observations, all 374 LLVM bytes and exit 255. An offline nanoda run checked the revision-bound signed-literal theorem with 29,374 declarations against an independently provisioned reference. The [qualification](https://github.com/MGYamada/Vastitas/tree/main/experiments/compiler_validation/official_exit) records its verifier and resource limits. A live boxed-program stage certificate binds the current revision, decoded physical files, graph, integer and every LLVM byte in Official and Fast. Public CLI modes, per-build source admission and coverage of additional artifacts remain."

