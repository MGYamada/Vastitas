remaining = "For each admitted functor from a named opposite the public revision yields the reversed composition diagram. Its Core lookup and emitted switch return the ordinal of the mathematical opposite composite for every in-domain pair. The S3 executable distinguishes both products. Whole-module CF_fin, CS_fin and storage-to-value MS_fin remain."

[[issue]]
number = 753
title = "LLVM emission and native backend"
state = "open"
depends = [752]
remaining = "The public LLVM preview emits complete bytes for unary lookup, its forwarding caller, signed literal and folded arithmetic entries, and a Bool caller with both predecessor edges of a phi. LLVM 23.1.4 on macOS arm64 also executed the closure Monad unit and binary lookup on S3, including reversed source operands. The compiler linked and installed three entry executables, which returned 255, 10 and 42. Closed finite packages emit direct calls, guarded row-major lookups with up to six axes, nullary lookups and phi nodes. The structured lookup retains both Boolean methods in 2,623 bytes for macOS arm64 and 2,647 bytes for x86-64 Linux. Both files have the same function model. On macOS, LLVM 23.1.4 emitted an ELF64 relocatable object from the Linux bytes. Straight-line boxed Nat/Int libraries call the versioned shim and release intermediate values. The static storage entry links a fixed C runtime and executes standard-chart identities at both widths for real and complex coordinates. Broader CFGs, numerical arithmetic, release qualification and production verification modes remain."

