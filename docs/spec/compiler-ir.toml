Indexed primitives and arbitrary-precision Nat and Int call one Lean-compiled
runtime library under a labeled foreign premise. A C shim exposes operations
that the runtime offers only inline. Each admitted Nat or Int operation is a
call in this profile.

Represented floating values stay in the resource layer and cross LLVM as
bits and arguments to adapter calls. All four F32/RR, F64/RR, F32/CC and
F64/CC representations are required. GEMM uses the pinned sequential LP64
OpenBLAS 0.3.34 adapter for sgemm, dgemm, cgemm and zgemm under a labeled
host/build-specific premise, with the corresponding real or interleaved complex
layout. A program that needs no numerical runtime requires no OpenBLAS.
Fixed-order adapter results follow the reference result bits, with a NaN class
where the reference does not specify the sign or payload. OpenBLAS results
have the stated determinism premise on one pinned build and host. Error
bounds and numerical correctness claims need their own evidence. The
NativeFast flags observation is unavailable. Its storage expectation uses
IEEE equality and a NaN expectation tests for NaN. Preserve foreign-call
identity, argument bits and order even where an observation abstracts the
result. The modeled LLVM subset emits no floating-point instructions and
rejects strict, LLVM-default and unadmitted sign-observing profiles.

Admitted division is totalized. The ordered same-precision scaled complex
quotient uses totalized real divisions and fixes the order and effects of the
graph, with inverse through the same graph. Emit no fallback, FMA or raw CUDA
division substitution. Float values gain no public pure-Core float carrier.
SafeFloat and the Result forms of safe division wait for the Result language
support.
