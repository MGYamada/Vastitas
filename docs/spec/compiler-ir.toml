[property."compiler-ir.stage-validation"]
title = "Every transformation checks an untrusted witness"
subject = "translation validators"
statement = """
Each validator receives the before and after artifacts plus a typed,
untrusted data witness. Soundness quantifies over every witness: a true
validator result implies observational refinement under the independent
semantics and stated foreign premises. Separate stages cover Core-to-Opt,
each enabled Opt pass, Opt-to-Exec, Exec-to-modeled LLVM and LLVM-to-bytes.
The initial optional optimizations are pure exact constant folding and
erasure of observationally inert metadata, each with its proof. A proposed
optimization that fails validation may use only an independently revalidated
baseline. A cost prediction, diagnostic receipt or cache hit is not proof.
Unproved floating reassociation, FMA, NaN quotients and changes to a selected
pullback must reject.
"""
