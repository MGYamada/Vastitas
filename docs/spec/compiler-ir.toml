# Compiler IR v1: the finite v0.1.0 contract adopted in #749.
# Generate compiler-ir.md with scripts/check_spec.py --write.
# A specified contract is not implemented, proved or natively qualified merely
# because this file exists. Each claim below retains its own evidence status.

[spec]
id = "compiler-ir"
title = "Compiler IR v1"
subject = "finite v0.1.0 compiler"
description = """
This specification is the source of the adopted finite compiler-IR v1
contract. It replaces the interim design text of PR #480 for that contract.
The production path specified here is accepted Lean Core, optimization and
execution phases of one MidIR, a modeled LLVM module and its complete emitted
LLVM bytes. Each claim identifies its required work, scoped tests or checked
theorems. The implemented Lean-source compilation path and its evidence
remain in Compiler architecture.
The eight decisions of #749 are recorded in the properties on the foreign
runtime (D1 and D7), independent semantics (D2), storage safety (D3), edition
(D4), floating carriers (D5), finite constitutional claims (D6), and the native
floating profile (D8). The release audit records coverage separately from this
specification; no specification text grants compiler acceptance.
"""

[property."compiler-ir.feasibility"]
title = "Feasibility before backend admission"
subject = "verification and native toolchain"
statement = """
Before the main lowering and proof implementation, measure official-kernel
reduction and nanoda checking over about 1,000 representative MidIR operations
on the 16 GiB macOS reference host and Linux. Record wall time and peak memory
separately for proof preparation and checking. Qualify llvm-sys 231.0.1 with
LLVM 23.1.4, the pinned Lean runtime and sequential LP64 OpenBLAS 0.3.34 on both
systems, recording build time, memory, disk use and binary size. A failure or
an unavailable toolchain remains a blocker; changing a pin, using native
evaluation as proof, or omitting a required platform does not pass the trial.
"""
specified_in = "[Compiler IR v1](spec/compiler-ir.md#compiler-ir.feasibility)"
example = "Official Lean and nanoda replay the same isolated 1,000-operation workload as one proof and in 64-operation chunks on Linux x86-64 and macOS arm64."
example_test = "experiments/compiler_validation/reduction/test_records.py::QualificationRecords::test_both_hosts_replayed_the_same_thousand_operation_exports"

[property."compiler-ir.feasibility".claim.qualification]
status = "tested"
evidence = [
  "experiments/compiler_validation/reduction/test_records.py::QualificationRecords::test_retained_records_bind_current_fixture_and_model",
  "experiments/compiler_validation/reduction/test_records.py::QualificationRecords::test_both_hosts_replayed_the_same_thousand_operation_exports",
  "experiments/compiler_validation/llvm/test_records.py::QualificationRecords::test_static_abi_records_bind_both_hosts_to_the_complete_fixture",
]
note = "The reduction records give wall time and peak resident memory for elaboration, Official replay, export and nanoda. Both native hosts linked LLVM 23.1.4 through llvm-sys 231.0.1 with the Lean 4.35.0 runtime and sequential LP64 OpenBLAS 0.3.34. Their target-specific inputs executed all four GEMM entry points. The native records include object and executable sizes, build-tree size and per-phase costs. These measurements cover the two feasibility experiments. Production module composition and offline distribution have separate requirements."

[property."compiler-ir.edition"]
title = "One finite edition and wire route"
subject = "source and package admission"
statement = """
The finite public profile requires package edition 2026 and the single wire
schema epoch 10. Flat input and --lib input normalize to that package envelope
with protected synthesized identities and original source spans. The bundled
frontend and independent Lean checker must agree on that schema. Retired
versions 2 through 9, an alternate flat decoder, a missing or different
edition and unsupported finite grammar forms must fail closed. The existing
wire cutover and manifest-edition gate do not establish the remaining finite
grammar or source-to-Core
correspondence obligations. The general edition grammar and Lean-native
frontend remain outside this finite profile.
"""
specified_in = "[Compiler IR v1](spec/compiler-ir.md#compiler-ir.edition)"
example = "A package and an equivalent flat input retain their original diagnostic locations through the same checked envelope."
example_not_executed = "The complete finite edition and source-correspondence migration is pending."

