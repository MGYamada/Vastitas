[property."compiler-ir.midir"]
title = "One phase-indexed typed MidIR"
subject = "MidIR v1"
statement = """
MidIR has optimization and execution phases of the same Lean-defined
Module, Function, Block, Op and Terminator representation. Typed SSA values
and block arguments retain nominal model, basis and endpoint indices,
FunctionId, selected method, assembly revision and specialization identity.
The optimization phase retains mathematical operations and selected pullback
information. The execution phase fixes the checked layouts, call ABI and
resource schedule. Ordered effects are explicit; control-flow edges preserve
block argument types and effect-token flow. Phase-specific well-formedness
checks reject invalid dominance, missing blocks, duplicate definitions and
incompatible joins. Bounded versioned dumps round-trip deterministically but
carry no acceptance authority.
"""
specified_in = "[Compiler IR v1](spec/compiler-ir.md#compiler-ir.midir)"
example = "An SSA branch whose incoming value has a different nominal endpoint is rejected even when both values have the same storage size."
example_not_executed = "The pure Bool and nominal tag fragment below exercises typed branches and joins. Module-wide validation is pending."

