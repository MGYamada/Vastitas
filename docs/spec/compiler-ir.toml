[property."compiler-ir.operators"]
title = "Operator spelling preserves family identity"
subject = "canonical scalar operations"
statement = """
Each admitted value operator selects the same canonical family, method,
assembly revision, Core denotation and effects as its named call:
std::operator::add, sub, neg, mul and div. In particular, / and div are two
spellings of one selected operation. Nat binary subtraction remains total
saturating subtraction; unary Nat negation is not admitted. Division admits
only the approved static promotion pairs, including Nat/Int to Int, with
homogeneous operands selecting their own division first. This does not extend
division's promotion rule to other operators. Implicit represented RR/CC
promotion, unimplemented bounded-integer operations, %, fdiv and unadmitted
dimension-annotation forms reject. A user function with the same short name
must not change a glyph's owner. All five short names denote their canonical
family; a competing unqualified binding at a call or function-value site
requires explicit qualification or an import alias. Naming a bounded type does not admit its
arithmetic or determine its overflow policy.
"""
specified_in = "[Compiler IR v1](spec/compiler-ir.md#compiler-ir.operators)"
example = "For admitted Nat operands 2 and 5, subtraction returns 0; / and div retain the same selected division FunctionId and type."
example_not_executed = "The exact Nat/Int subset has public tests; represented scalar operations and production LLVM correspondence are pending."

