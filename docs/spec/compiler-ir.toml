[property."compiler-ir.coverage"]
title = "Every constructor has an explicit disposition"
subject = "Core and storage coverage"
statement = """
A ledger at a named source revision must enumerate every accepted Core,
storage action, native storage instruction and runtime-extent constructor.
For each constructor it records an admitted typed MidIR mapping or an
explicit finite-profile rejection. Each admitted entry identifies its source
fixture, family and method, model, ownership facts, opcode and downstream
proof obligation. Any constructor or runtime change regenerates the ledger.
The runtime inventory follows the transitive closure of the admitted snapshot,
including frame and spectral runtimes where used; an older list of runtime
modules is not a completeness argument. Missing entries must fail the
coverage check instead of silently inheriting admission.
"""
specified_in = "[Compiler IR v1](spec/compiler-ir.md#compiler-ir.coverage)"
example = "Adding a Core constructor without an admitted mapping or rejection prevents the coverage ledger from passing."
example_not_executed = "The source-schema drift guard is implemented; admitted MidIR mappings and their preservation evidence remain pending."

