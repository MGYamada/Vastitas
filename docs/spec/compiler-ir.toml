operations and are compared with the binary32 or binary64 reference; an
arithmetic NaN is specified as a NaN without a fixed sign or payload.
Class (ii) OpenBLAS calls are deterministic for one pinned build on one host
under a foreign premise. No ideal tensor accuracy or error bound follows.
Native flags are Unavailable, never empty. NativeFast does not specify the
sign of a class (ii) zero or the sign and payload of a NaN from either class.
Programs selecting a strict or LLVM-default floating profile reject.
NativeFast is distinct from an opt-in fastfloat profile.
