[property."compiler-ir.families"]
title = "One owned static function family"
subject = "function identity and assembly"
statement = """
Every named function has one owned static FunctionId, a complete method set
and a checked assembly revision. A singleton function, a multi-method family
and a bodyless coverage contract use the same public fn model. Static calls
and function values retain their selected target and specialization key.
Expected return types, import order and runtime values must not choose a
method. Every body, including an unused, nonwinning or out-of-domain body,
remains subject to the independent checks. Structured assemble blocks lower
to edit events with statement and closing-brace spans; generated loan names
are deterministic and collision-free. The migration removes public generic,
method and flat assembly declarations without a permanent alternate parser.
"""
specified_in = "[Compiler IR v1](spec/compiler-ir.md#compiler-ir.families)"
example = "Changing an unselected method or a family owner invalidates the family evidence even if a selected call returns the same value."
example_not_executed = "The unified family and structured assembly migration is pending."

