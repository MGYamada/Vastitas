[property."compiler-ir.numeric-order"]
title = "Floating observation does not permit a compiler quotient"
subject = "fixed-order numerical operations"
statement = """
The baseline preserves foreign-call identity, argument bits, effect order
and returned-bit identity. A one-step NaN or signed-zero observation is not
a contextual congruence and must not authorize a rewrite. A stronger rewrite
needs a proved operation-closed continuation relation or a checked domain
restriction. The fixed-order reference includes dot update, diagonal scale
and adjoint, totalized real division and the selected same-precision complex
quotient graph. Real division takes the product on an effective-zero divisor
and IEEE division otherwise. Complex inverse is division of (1,+0) by its
argument using that graph, without a robust fallback, implicit widening, FMA
or complex-specific NaN repair. Under NativeFast, expect uses IEEE equality
and a NaN literal expects a NaN; it is not a raw-bit observation.
"""
