[property."compiler-ir.storage"]
title = "Storage safety comes from checked refinement"
subject = "ownership and initialization"
statement = """
The ownership authority is the kernel storage checker on the storage plan
of accepted Core. MidIR does not introduce a competing ownership checker.
Each lowering preserves the plan's initialized bytes, provenance, layouts,
aliases, suspended reborrows, inside-out returns, branch joins and normal or
failure cleanup through refinement. A transformation that changes allocation,
reuse, aliases or release order must provide their mapping in its untrusted
witness. Local SSA well-formedness alone proves none of these resource facts.
No owner or loan may escape its checked scope.
"""
specified_in = "[Compiler IR v1](spec/compiler-ir.md#compiler-ir.storage)"
example = "Moving a release before the final read is rejected even when each function has a well-typed SSA body."
example_not_executed = "The checker refines linear static plans, including NativeFast GEMM, with a literal entry result. Dynamic control flow and runtime extents require additional lowering."

