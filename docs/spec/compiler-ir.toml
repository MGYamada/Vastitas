[property."compiler-ir.finite-models"]
title = "Finite category models use checked tables"
subject = "finite indexed families and selected models"
statement = """
Reusable finite carriers and tables are static data. Named category,
functor, natural-transformation and Monad instances bind those data and their
revisions to independently checked law evidence. Category composition covers
all and only composable arrow pairs; a functor has both object and arrow maps.
A selected Monad identity includes C, T, eta and mu, distinct from its
proof-irrelevant IsMonad certificate. Opposite reverses endpoints and
composition without duplicating the carrier. Generic finite schema checking,
not the spelling std::category or a hard-coded example, supplies admission.
S3 supplies a noncommuting category fixture, and the closure T(0)=T(1)=1 on
0<1 supplies a nonidentity lawful Monad fixture. Derived Kleisli laws come
from that same Monad evidence; its optional execution adapter owns no second
mathematical semantics.

The std::category::Monad schema owns the mathematical structure. The optional
monad package depends on its category package. For a selected Monad M,
monad::kleisli::unit at X returns eta_X. Given p from
S to T X and f from X to T Y, bind(p,f) returns (mu_Y after T f) after p.
The optional package exports Kleisli and KleisliTriple views of that named M.
Hom<K,X,Y> uses the base fiber from X to T Y. extend(f) returns mu_Y after T f.
compose(g,f) returns bind(f,g). lift(f) follows an ordinary arrow f by
the unit at its target. Every arrow belongs to the selected category.
Static object arguments select eta and mu, and the two runtime arrows of
bind and compose are explicit parameters.
