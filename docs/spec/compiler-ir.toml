[property."compiler-ir.finite-binders"]
title = "Finite binders do not admit general polymorphism"
subject = "finite table lookup and Hom indices"
statement = """
The finite public forms are indexed finite carrier declarations, indexed
table declarations, indexed instance declarations and ordinary fn operations.
Function binders range only over statically selected finite model, object,
functor, transformation, Monad and table schemas. Hom indices and associated
table projections are checked independently. Input types may determine a
unique binder; otherwise the call supplies it explicitly with turbofish.
For M bound to a Monad schema, Obj<M::category> selects its objects.
Hom<M::category,X,M::T<Y>> uses the selected object action. A Hom value
records its category and concrete endpoints. A caller supplies the Monad
explicitly because several structures can share a category and endofunctor.
Checking applies T to an explicit object argument, including when T maps
several inputs to the same object.
Expected result types must not choose it. A dependent table signature and
checked coverage preserve Hom fibers during lookup. A raw tag has no implicit
cast to Hom. Runtime arrows are finite tags and lookup lowers to validated
finite branches; evidence and model selection have no runtime dictionary.
The 4096-key and specialization bounds remain, and finite-law work is bounded
before enumeration. General type parameters, arbitrary const computation,
higher-rank forms and runtime model selection remain outside this profile.
"""
specified_in = "[Compiler IR v1](spec/compiler-ir.md#compiler-ir.finite-binders)"
example = "The projected composition table takes Hom(C,Y,Z) and Hom(C,X,Y) and returns Hom(C,X,Z) under the same selected C revision."
example_test = "tests/finite_binders.rs::inferred_and_explicit_indices_select_the_same_nominal_specialization"

