[property."reverse-core.steps"]
title = "Compiled steps"
subject = "cotangentJacobian"
statement = """
The backward step along a declared map m applies the Jacobian table of m, which
the kernel computes from the exact map, to the seed. The table applied to a
seed η at a point x is cot m x η. When the saved output point is the image of
the input point, the table step is the pullback along m at the input point,
for every seed. Every registry binding keeps the promise of its derivative
rule, which the compilation reads.
"""
specified_in = "[Smooth affine geometry and reverse pullbacks](verification.md#smooth-affine-geometry-and-reverse-pullbacks)"
example = """
The table step of g(x, y) = x² + y at (3, 9) pulls dt at 18 back to 6 dx + dy,
and the table step of f(t) = (t, t²) at 3 pulls that back to 12 dt.
"""
example_test = "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes"

[property."reverse-core.steps".claim.oracle]
