# Properties of compiled reverse Core. docs/specifications.md defines the
# format; scripts/check_spec.py checks this file and generates reverse-core.md.

[spec]
id = "reverse-core"
title = "Compiled reverse Core"
subject = "the smooth profile's reverse passes"
description = """
After acceptance, the kernel compiles every reverse site of a checked module
into Core of its own. A site is a pullback in either mode, a differential or
the reverse pass of a tape. The forward Core at the site binds the input point r₀ and the
images rᵢ = mᵢ(rᵢ₋₁) along the maps m₁, …, m_k of the site. A generated
backward function pulls the seed back along m_k, …, m₁: a declared map by its
Jacobian table, any other map value by the runtime reverse pass. The ledger of
the compilation lists every site with its generated function. The theorems
below concern the checked Core and the kernel evaluator, not the generated
text or native code.
"""

[property."reverse-core.backward.saved"]
title = "Saved backward Core"
subject = "Core.Reverse.Entry.generated"
statement = """
Let a saved site have the step programs m₁, …, m_k, which compose. Call its
generated backward function on one program per opaque step, the input point
r₀, saved points r₁, …, r_k and a seed η, where each rᵢ has the coordinates of
mᵢ(rᵢ₋₁). The call evaluates to the saved-mode pullback of η along
m_k ∘ ⋯ ∘ m₁ at r₀. A seed that does not lie over r_k gives the failure value
⊥. This holds for every entry of a compiled module.
"""
specified_in = "[Smooth affine geometry and reverse pullbacks](verification.md#smooth-affine-geometry-and-reverse-pullbacks)"
example = """
In the acceptance example, the site pullback(gAfterF, x, seed), with
gAfterF = compose(g(), f()), saves f(3) = (3, 9) and g(3, 9) = 18. Its
generated function pulls dt at 18 back to 12 dt at 3, and the seed dt at 17
gives the failure value.
"""
example_test = "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes"

[property."reverse-core.backward.saved".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.SmoothReverseCore.saved_function_pullback",
  "VastitasOracle.SmoothReverseCore.saved_function_foreign_seed",
  "VastitasOracle.SmoothReverseCompiled.compiled_saved_entry",
  "VastitasOracle.SmoothReverseCompiled.compiled_saved_entry_foreign_seed",
]
premises = [
  "for `saved_function_pullback` and `saved_function_foreign_seed`: the module declares the backward step of every map under the site's names (`StepsDeclared`), the map type of every declared step names two objects (`StepFormed`), the site has a step, and the activation binds the parameters of the generated function to the arguments",
  "`compiled_saved_entry` and `compiled_saved_entry_foreign_seed` discharge these module premises for every entry of a compiled module",
  "one program per opaque step",
  "for the pullback: the programs compose (`Composable`) and the saved points satisfy the residual relation (`ResidualRel`)",
  "for `saved_function_foreign_seed`: the residual relation, and a seed whose point is not that of the last saved point",
  "for the compiled forms: the entry belongs to the ledger of a compiled module, its site saves, and the arguments of the call evaluate to the opaque programs, the points and the seed",
]
note = """
None of these theorems uses the chain rule. The proofs use the Jacobian table
steps (`VastitasOracle.SmoothJacobian.jacobianStep_eq_of_output`) and the
stepwise pullback, and `scripts/check_chain_rule_free.lean` checks this on the
constants that each theorem uses. That consecutive steps share their objects
is not proved, and no theorem needs it.
"""

[property."reverse-core.backward.saved".claim.test]
status = "tested"
evidence = [
  "tests/reverse_core.rs::acceptance_sites_compile_to_generated_backward_functions",
  "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes",
  "tests/smooth_differential.rs::mutated_observations_change_the_native_result",
  "VastitasKernel.ReverseCoreRegression",
]
note = """
Observations 2 and 8 of the [acceptance example](../stage3-acceptance.md#acceptance-conditions)
run compiled saved sites, the second with a seed over another point. The Rust
test checks that the saved sites receive the images from the caller.
`ReverseCoreRegression` compares every compiled site with its source site,
failures included, and rejects forged backward functions.
"""

[property."reverse-core.backward.saved".claim.bridge]
status = "proved-bridge"
evidence = [
  "VastitasBridge.Differential.compiled_saved_entry_frechet",
  "VastitasBridge.Differential.compiled_saved_entry_kaehler",
]
premises = [
  "the entry belongs to the ledger of a compiled module (`Reverse.Compiled`), its site saves, and the generated function is called with one program per opaque step",
  "the arguments of the call evaluate to the opaque programs, the input point, the saved points and the seed, and the saved points satisfy the residual relation (`ResidualRel`)",
  "the chain of the step programs is well typed from `n` to `m` coordinates, and the seed lies over its image of the input point with `m` components",
  "for `compiled_saved_entry_frechet`: the input point has `n` coordinates",
]
assumes = ["mathlib"]
note = """
The saved backward Core evaluates to the covector `η ∘ DF(x)`, where `F` is the
real program of the chain of the step programs, through `HasFDerivAt.comp`
(`Frechet`). Its components are the Kähler pullback fiber. The proofs start
from the oracle's `compiled_saved_entry`. They use neither the kernel chain rule
(`cot_compose`, `backward_eq_cot`) nor the formal chain rule `pderiv_aeval`;
`lean-bridge/Audit.lean` checks this on the constants that the proofs use.
"""

[property."reverse-core.backward.saved".claim.native]
status = "not-claimed"
reason = """
The theorems concern the Core that the kernel generates and the kernel
evaluator. No claim states that the generated text or the compiled native code
refines them. Tests run the native code.
"""

[property."reverse-core.backward.recomputed"]
title = "Recomputed backward Core and agreement of the policies"
subject = "Core.Reverse.Entry.generated"
statement = """
Call the generated backward function of a recomputing site on one program per
opaque step, the input point r₀ and a seed η, with programs that compose. It
evaluates the images again and gives the recomputing pullback of η along
m_k ∘ ⋯ ∘ m₁ at r₀. With saved points that are the images, the saved and the
recomputing generated functions of a site have the same value. This holds for
every entry of a compiled module.
"""
specified_in = "[Smooth affine geometry and reverse pullbacks](verification.md#smooth-affine-geometry-and-reverse-pullbacks)"
example = """
pullback_recomputed(gAfterF, x, seed) evaluates f and g again in its generated
function and agrees with the saved pullback. Along sq ∘ g ∘ f the recomputing
function evaluates sq at its own forward point 18, so dt at 324 pulls back to
36 · 12 = 432 dt.
"""
example_test = "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes"

