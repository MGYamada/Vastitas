[property."reverse-core.validation"]
title = "Translation validation and public paths"
subject = "Core.Reverse.Compiled"
statement = """
A compilation stage holds its generated module and ledger exactly when
compiling the source module again gives both. Every entry's generated function
and declarations are found by their ids. Every entry is well formed: its site
has a step, and every declared step names two objects and is a declaration
with the derivative rule morphism. Its forward, backward and seed steps are
declared under its names. On protocols 2-6, 7 and 8/9, consider every entry of
a compiled module that the accepted certificate carries, or of the module that
the pure emit path generates code from. A call of its generated function
computes the pullback along the chain of the step programs passed as
arguments, in its mode.
"""
specified_in = "[Smooth affine geometry and reverse pullbacks](verification.md#smooth-affine-geometry-and-reverse-pullbacks)"
example = """
The 22 reverse calls of the acceptance program compile to 22 generated
functions, numbered after the source functions and placed first. Each Jacobian
step lies in a generated function.
"""
example_test = "tests/reverse_core.rs::acceptance_sites_compile_to_generated_backward_functions"

