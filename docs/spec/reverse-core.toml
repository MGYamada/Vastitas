[property."reverse-core.meaning"]
title = "Meaning in coordinates"
subject = "Core.Reverse.Entry.generated"
statement = """
Let the chain m_k ∘ ⋯ ∘ m₁ of the step programs be well typed from ℝⁿ to ℝᵐ,
and let the seed η lie over its image of the input point x with m components.
Then the generated backward function of a saved or a recomputing site
evaluates to the covector at x whose components are cot of the composite map
at x applied to η.
"""
specified_in = "[Smooth affine geometry and reverse pullbacks](verification.md#smooth-affine-geometry-and-reverse-pullbacks)"
example = """
The compiled sites of stepwise pull dt at g(f(3)) = 18 back to 12 dt at 3, the
derivative of g ∘ f(t) = 2t² at 3. The compiled differential of
g(x, y) = x² + y at (1, 2) is (2, 1).
"""
example_test = "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes"

