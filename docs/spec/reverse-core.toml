[property."reverse-core.forward"]
title = "Forward Core"
subject = "Core.Reverse.forwardLets"
statement = """
The forward Core of a site binds, one let per step and in application order,
the evaluated images r₁ = m₁(r₀), …, r_k = m_k(r_{k-1}) of the input point. It
evaluates to a value exactly when its body evaluates to that value with those
points bound. The points satisfy the residual relation, and r_k has the
coordinates of the primal value m_k ∘ ⋯ ∘ m₁ at r₀. The compiled Core of a
site holds these lets after the input point.
"""
specified_in = "[Smooth affine geometry and reverse pullbacks](verification.md#smooth-affine-geometry-and-reverse-pullbacks)"
example = """
At the site pullback(gAfterF, x, seed) of the acceptance example, the forward
Core binds f(3) = (3, 9) and then g(3, 9) = 18 before it calls the generated
function.
"""
example_test = "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes"

[property."reverse-core.forward".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.SmoothReverseCore.forwardLets_evaluates",
  "VastitasOracle.SmoothReverseCore.forwardLets_primal",
  "VastitasOracle.SmoothReverseCompiled.compileSite_term",
]
premises = [
  "the module declares the forward step under the site's name as `smoothApply`; `VastitasOracle.SmoothReverseCompiled.entry_well_formed` discharges this for every entry of a compiled module",
  "the map terms evaluate to the step programs and read no symbol at or above a bound, every bound symbol is at or above it, and the term of the previous point evaluates to the input point",
  "for the primal value in `forwardLets_primal`: the site has a step",
