[property."reverse-core.sites"]
title = "Rewritten sites"
subject = "Core.Reverse.compileSite"
statement = """
The term that the compilation puts at a site and the source call evaluate to
the same value. This holds for a pullback in either mode, for a differential,
whose generated seed is the unit covector at the primal value, and for the
reverse pass of a tape, direct or bound by a let. The maps that the derivative
rules read from the map operand are its maps: its value is a composition tree
whose leaves are the step programs.
"""
specified_in = "[Smooth affine geometry and reverse pullbacks](verification.md#smooth-affine-geometry-and-reverse-pullbacks)"
example = """
In the Core module of the cotangent regression, each of the 45 sites, compiled
on its own, evaluates to the value of its source site, failures included.
"""
example_test = "VastitasKernel.ReverseCoreRegression"

