[property."arithmetic.embedding"]
title = "The Nat-to-Int embedding"
subject = "std::arithmetic::generic"
statement = """
The embedding of Nat into Int preserves addition, order and the maximum. So
int(a + b) = int(a) + int(b), int(a) ≤ int(b) exactly when a ≤ b, and
int(max(a, b)) = max(int(a), int(b)).
"""
specified_in = "[Nat/Int promotion](stage1a.md#promotion)"
example = "`int(20 + 22)` equals `int(20) + int(22)`, which is 42."
example_not_executed = "The facts are lemmas about Int.ofNat; no program evaluates them on their own."

[property."arithmetic.embedding".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.IndexedPromotion.embedding_preserves_addition",
  "VastitasOracle.IndexedPromotion.embedding_preserves_order",
  "VastitasOracle.IndexedPromotion.embedding_preserves_maximum",
]
premises = []

[property."arithmetic.mixed"]
title = "Mixed addition and maximum"
subject = "std::arithmetic::generic"
statement = """
`add` and `maximum` on any two of Nat and Int evaluate, for all arguments, to
the sum and the maximum of their integer values. The result is Nat for two Nat
inputs and Int otherwise.
"""
specified_in = "[Nat/Int promotion](stage1a.md#promotion)"
example = "For `n: Nat = 20`, `add(n, -7)` is 13 and `maximum(-7, n)` is 20."
example_test = "tests/promotion.rs::mixed_arithmetic_delegates_to_homogeneous_kernels_in_both_modes"

[property."arithmetic.mixed".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.IndexedPromotion.addition_correct",
  "VastitasOracle.IndexedPromotion.maximum_correct",
]
premises = [
  "dispatch selects, for these argument types, the function of the fixture module with this source name and these parameter types; `VastitasPromotion.IndexedRegression` tests the selection, and no theorem cited here proves it",
]
assumes = ["promotion-reflection", "rust-frontend"]
note = """
The theorems concern `VastitasKernel.IndexedPromotionFixture.checked`. They
evaluate the bodies themselves: a mixed method promotes its inputs once and
calls the homogeneous Int method, and a homogeneous method calls its kernel.
They state the results, not this call structure.
"""

[property."arithmetic.mixed".claim.test]
status = "tested"
evidence = [
  "tests/promotion.rs::mixed_arithmetic_delegates_to_homogeneous_kernels_in_both_modes",
  "VastitasPromotion.IndexedRegression",
]

