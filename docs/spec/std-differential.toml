# Properties of std::differential. docs/specifications.md defines the format;
# scripts/check_spec.py checks this file and generates std-differential.md.

[spec]
id = "differential"
title = "std::differential"
subject = "std::differential"
description = """
The laws of the metric-free cotangent pullback of `std::differential`, from
ADR 0001 §10. For a smooth map f, a point x and a seed η over f(x), the
pullback is the covector η ∘ Df(x) over x. A seed over another point gives the
failure value ⊥. The theorems below concern the runtime operations that the
`std::differential` bindings evaluate to. The kernel compiles each reverse pass
that it can read into generated Core, which calls these operations only for
its opaque steps; [compiled reverse Core](reverse-core.md) states what that
Core computes. The runtime operations remain the reference that it agrees
with.
"""

[property."differential.pullback.linear"]
title = "Linearity in the seed"
subject = "std::differential::pullback"
statement = """
Let f be a smooth map, x a point, η and η' seeds over f(x), and a and b
rationals. The pullback along f at x is linear in the seed: it maps aη + bη' to
a times the pullback of η plus b times the pullback of η'.
"""
specified_in = "[ADR 0001 §10, Laws](adr/0001-mathematics-first-stdlib.md#laws)"
example = """
Along f(t) = (t, t²) at 3, the seeds (1, 0) and (0, 1) pull back to 1 dt and
6 dt, so the seed (2, 1) pulls back to 8 dt.
"""
example_not_executed = "No test pulls back a combination of seeds."

[property."differential.pullback.linear".claim.proof]
status = "planned"
issue = 649
note = """
`VastitasBridge.Differential.pullback_getD_eq_fderiv_adjoint` gives component
j of the result as Σᵢ ηᵢ (Df(x) eⱼ)ᵢ, which is linear in η, but no theorem
states linearity. The Python reference checks the homogeneity of its own
pullback in `scripts/test_metric_reference.py`; that test does not run the
kernel.
"""

[property."differential.pullback.identity"]
title = "Identity"
subject = "std::differential::pullback"
statement = """
Pullback along the identity map of ℝⁿ at a point x returns every seed over x
unchanged, in the `saved` and in the `recomputed` mode.
"""
specified_in = "[ADR 0001 §10, Laws](adr/0001-mathematics-first-stdlib.md#laws)"
example = "The identity of the plane pulls the covector (5, 7) at (1, 2) back to itself."
example_test = "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes"

[property."differential.pullback.identity".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.SmoothRuntime.pullback_identity",
  "VastitasOracle.SmoothRuntime.cot_identity",
  "VastitasOracle.SmoothCalculus.Cov.pullback_id",
]
premises = [
  "for `pullback_identity`: the seed lies over the point and has one component per coordinate of the point",
  "for `cot_identity`: the seed has n components",
]

[property."differential.pullback.identity".claim.test]
status = "tested"
evidence = [
  "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes",
  "tests/smooth_differential.rs::mutated_observations_change_the_native_result",
]
note = """
Observation 15 of the [acceptance example](../stage3-acceptance.md#acceptance-conditions)
pulls a covector back along the identity of the plane. Observation 10 pulls the
failure value back along the identity of the line. The mutation test shows that
a wrong result changes the native output.
"""

[property."differential.pullback.identity".claim.native]
status = "not-claimed"
reason = """
The theorems concern the Lean runtime definitions that the checker shares with
the generated programs, which call them for opaque steps and for reverse
passes that the compilation keeps. A compiled reverse pass runs generated Core,
whose agreement with these definitions is proved per site under premises and
tested on whole programs ([compiled reverse Core](reverse-core.md)). No claim
states that the compiled native code refines them. Tests run the native code.
"""

[property."differential.pullback.composition"]
title = "Composition"
subject = "std::differential::pullback"
statement = """
Pullback along g ∘ f at x equals pullback along g at f(x) followed by pullback
along f at x. This holds for every seed, including a seed over another point
and the failure value ⊥.
"""
specified_in = "[ADR 0001 §10, Laws](adr/0001-mathematics-first-stdlib.md#laws)"
example = """
Take f(t) = (t, t²) and g(x, y) = x² + y. The seed dt at g(f(3)) = 18 pulls back
along g at (3, 9), then along f at 3, to 12 dt. That is its pullback along
g ∘ f at 3.
"""
example_test = "tests/stdlib_differential.rs::library_profile_checks_builds_and_runs_from_a_path_package"

[property."differential.pullback.composition".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.SmoothRuntime.pullback_stepwise",
  "VastitasOracle.SmoothRuntime.pullback_stepwise_of_wellTyped",
  "VastitasOracle.SmoothCalculus.cot_compose",
  "VastitasOracle.SmoothCalculus.backward_eq_cot",
  "VastitasOracle.SmoothCalculus.pullback_composite",
  "VastitasOracle.SmoothCalculus.Cov.pullback_comp",
]
premises = [
  "for `pullback_stepwise`: the input arity of the outer program equals the output arity of the inner one; `pullback_stepwise_of_wellTyped` derives this from the typing of the composite",
  "for `cot_compose`: both maps are well formed between their dimensions",
  "for `backward_eq_cot` and `pullback_composite`: the program is well typed",
]
note = """
`pullback_stepwise` states the law for the program node that `compose` builds.
`backward_eq_cot` and `pullback_composite` show that this pullback equals the
pullback along the composite polynomial map, and `cot_compose` is the chain
rule for that map. The chain-rule proofs of `SmoothCalculus` use dual numbers
and `Lean.Grind.CommRing`, not mathlib.
"""

[property."differential.pullback.composition".claim.bridge]
status = "proved-bridge"
evidence = [
  "VastitasBridge.Differential.cot_compose",
  "VastitasBridge.Differential.backward_eq_cot",
  "VastitasBridge.Differential.pullback_composite",
  "VastitasBridge.Differential.pullback_comp",
  "VastitasBridge.Differential.cot_compose_kaehler",
]
premises = [
  "for `cot_compose`, `pullback_comp` and `cot_compose_kaehler`: both maps are well formed between their dimensions",
  "for `backward_eq_cot` and `pullback_composite`: the program is well typed",
]
assumes = ["mathlib"]
note = """
`cot_compose` follows the formal chain rule `pderiv_aeval` for mathlib's
`pderiv`, which `VastitasBridge.Differential.Prerequisites` proves.
`cot_compose_kaehler` proves the same equation from the functoriality of
Kähler differentials, independently of `cot_compose`.
"""

[property."differential.pullback.composition".claim.test]
status = "tested"
evidence = [
  "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes",
  "tests/smooth_differential.rs::mutated_observations_change_the_native_result",
  "tests/stdlib_differential.rs::library_profile_checks_builds_and_runs_from_a_path_package",
  "VastitasAlgebraTest.SmoothReferenceRegression",
]
note = """
Observation 1 of the [acceptance example](../stage3-acceptance.md#acceptance-conditions)
checks 12 dt. Observations 2 to 4 compare the stepwise pullback with the
pullback along the composite program, along the composite as one map and along
a declared map. Observation 5 checks that the composite and the declared map
are the same map. Since the reverse passes are compiled, both sides of
observation 2 run Jacobian steps along `g` and `f`, and so do both sides of the
composition observation of the library package, so neither runs the runtime
pass on a composite program. Observation 3 compares the stepwise pullback with
the runtime pass along the composite as one map, an opaque step over
`composite(…)`, and observation 4 with the table of the declared map `gf`.
`SmoothReferenceRegression` runs the runtime pass on the composite programs of
`tests/fixtures/smooth-differential.json`, which the independent Python
references generate.
"""

