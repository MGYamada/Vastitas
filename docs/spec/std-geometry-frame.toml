# Properties of std::geometry::frame. docs/specifications.md defines the
# format; scripts/check_spec.py checks this file and generates
# std-geometry-frame.md.

[spec]
id = "frame"
title = "std::geometry::frame"
subject = "std::geometry::frame"
description = """
The properties of the ordered frames of smooth affine objects, from ADR 0001
§11. A frame b of a smooth affine object X of dimension n has n columns in the
coordinate frame of X, which form the matrix P(p) at each point p. The module
declares the families `Frame<X>`, `Coords<b>`, `CoCoords<b>` and
`FrameMap<b, c>`. The application declares each frame and each frame
primitive, which names its frames. The frame array of a vector v at p in b is
P(p)⁻¹v, and the frame array of a covector α at p is P(p)ᵀα. The transition
from b to b′ at p is P_b′(p)⁻¹·P_b(p). The failure value ⊥ lies over no point.
"""

[property."frame.static-identity"]
title = "Frames are static"
subject = "std::geometry::frame::Coords"
statement = """
An array or a map array names its frames in its type. A frame primitive
accepts an operand only in the frame that its binding or its other operands
require: decoding in the frame of its binding, `frame_apply` with the source
frame of the map, `frame_coapply` with the target frame of the map,
`frame_compose` with equal middle frames, and `frame_pairing` and
`frame_equal` in one frame. Any other operand is an error (`E_ENDPOINT`).
"""
specified_in = "[ADR 0001 §11, Contract and jurisdiction](adr/0001-mathematics-first-stdlib.md#contract-and-jurisdiction-1)"
example = """
Let b = columns((1, 0), (1, 2)) and b2 = columns((2, 0), (0, 1)) be frames of
the plane. Comparing the array of a vector in b with its array in b2 is an
error (`E_ENDPOINT`) that names `Coords<b>` and `Coords<b2>`.
"""
example_test = "tests/stdlib_frames.rs::arrays_in_different_frames_of_one_object_are_rejected_statically"

[property."frame.static-identity".claim.binding]
status = "proved-oracle"
evidence = [
  "VastitasOracle.FramePrimitives.frameDecode_association",
  "VastitasOracle.FramePrimitives.frameApply_association",
  "VastitasOracle.FramePrimitives.frameCoapply_association",
  "VastitasOracle.FramePrimitives.frameCompose_association",
  "VastitasOracle.FramePrimitives.framePairing_association",
  "VastitasOracle.FramePrimitives.frameEqual_association",
]
premises = []
assumes = ["rust-frontend"]
note = """
Each theorem characterizes the operand types that the shape of a frame
binding associates with a result: the frames of the operands must be equal
where the statement requires it. The kernel's typing of a call reads that
association, so the theorems concern checked bindings and the Rust frontend
relates them to source declarations.
"""

[property."frame.static-identity".claim.test]
status = "tested"
evidence = [
  "tests/stdlib_frames.rs::arrays_in_different_frames_of_one_object_are_rejected_statically",
  "tests/stdlib_frames.rs::a_frame_of_an_object_outside_cinf_affine_is_rejected",
]
note = """
The first test compares arrays in two frames of one object. The second
declares a frame of an object that is not a smooth affine object, which the
kernel rejects (`E_FRAME`).
"""

[property."frame.embedded"]
title = "Primitives embed their declared frames"
subject = "std::geometry::frame::Frame"
statement = """
A valid frame primitive embeds each frame that it names exactly as that frame
is declared: its object, its matrix P and its inverse Q. A binding with
another object, matrix or inverse is not valid.
"""
specified_in = "[ADR 0001 §11, Contract and jurisdiction](adr/0001-mathematics-first-stdlib.md#contract-and-jurisdiction-1)"
example = """
The primitive `enc_b = frame_encode(Tangent, Coords, frame = b)` carries the
columns (1, 0) and (1, 2) of b and the inverse that the kernel computes for
them.
"""
example_test = "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package"

[property."frame.embedded".claim.binding]
status = "proved-oracle"
evidence = [
  "VastitasOracle.FramePrimitives.frameDeclared_spec",
  "VastitasOracle.FramePrimitives.frameDeclared_object",
]
premises = [
  "the embedded frame passes `frameDeclared`, which the kernel's contract of every frame binding requires",
]
assumes = ["rust-frontend"]

[property."frame.embedded".claim.test]
status = "tested"
evidence = [
  "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package",
  "VastitasKernel.FrameRegression",
]
note = """
`FrameRegression` forges the embedded object, matrix and inverse of frame
bindings in checked Core, and the kernel's audit rejects each forgery.
"""

[property."frame.adequacy"]
title = "Decoding after encoding"
subject = "std::geometry::frame::Coords"
statement = """
Decoding the frame array of a vector or a covector in a frame b gives back the
vector or covector, and encoding a decoded array gives back the array. The
failure value ⊥ stays ⊥.
"""
specified_in = "[ADR 0001 §11, Laws](adr/0001-mathematics-first-stdlib.md#laws-1)"
example = """
At p = (1, 2) the vector (3, 2) has the array (2, 1) in b = columns((1, 0),
(1, 2)), and the array decodes to (3, 2). The covector (2, 1) has the array
(2, 4) in b, which decodes to (2, 1).
"""
example_test = "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package"

[property."frame.adequacy".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.FrameRuntime.adequacy",
  "VastitasOracle.FrameAcceptance.c4_adequacy",
]
premises = [
  "for `adequacy`: P(p)·Q(p) = Q(p)·P(p) = I at every point p, which `VastitasOracle.FrameDeclarations.frame_sound` proves for every frame declaration of a valid environment",
  "for `c4_adequacy`: the declaration environment of the module is valid, the operand of the inner call evaluates to a value of its checked type, and `frame_encode(frame_decode(a))` encodes in the frame that it decodes from",
]
assumes = ["rust-frontend"]
note = """
`adequacy` states the four identities of the frame runtime: decoding undoes
encoding and encoding undoes decoding, for vectors and for covectors. A
fiber without one point coordinate and one component per frame vector gives
the failure value, and the failure value stays the failure value.
`c4_adequacy` states the same of accepted Core: the type `Coords<b>` fixes the
frame in which `frame_decode(frame_encode(v))` decodes, and the valid
environment makes the embedded frame invertible.
"""

[property."frame.adequacy".claim.test]
status = "tested"
evidence = [
  "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package",
  "tests/stdlib_frames.rs::mutated_frame_observations_change_the_native_result",
  "VastitasKernel.FrameRuntimeRegression",
  "VastitasKernel.FrameRegression",
]

[property."frame.adequacy".claim.native]
status = "not-claimed"
reason = """
The frame runtime is Lean code that the checker and the generated programs
share. No claim states that the compiled native code refines it. Tests run
the native code.
"""

[property."frame.transitions"]
title = "Transitions"
subject = "std::geometry::frame::FrameMap"
statement = """
For frames b and b′ of one object, the transition from b to b′ at a point p
takes the array of a vector in b to its array in b′. The transitions from b to
b′ and from b′ to b at p are inverse to each other.
"""
specified_in = "[ADR 0001 §11, Laws](adr/0001-mathematics-first-stdlib.md#laws-1)"
example = """
Let r = columns((1, 0), (x, 1)), with the inverse columns((1, 0), (-x, 1)). At
p = (1, 2) the transition from r to b takes the array (1, 2) in r to the
array (2, 1) in b, and the transition back gives (1, 2) again.
"""
example_test = "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package"

[property."frame.transitions".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.FrameRuntime.transition_laws",
  "VastitasOracle.FrameAcceptance.c5_transitions",
]
premises = [
  "for `transition_laws`: the point has n coordinates, P_b(p)·Q_b(p) = Q_b(p)·P_b(p) = I and P_b′(p)·Q_b′(p) = Q_b′(p)·P_b′(p) = I at the point, and the vector has n components",
  "for `c5_transitions`: the declaration environment of the module is valid, and the point operand evaluates to a value of its checked type",
]
assumes = ["rust-frontend"]
note = """
`transition_laws` states that the transition from b to b is the identity,
that the transition from b′ to b″ after the transition from b to b′ is the
transition from b to b″, that the transitions from b to b′ and from b′ to b
are inverse, and that a transition sends the array of a vector in b to its
array in b′. `c5_transitions` states the first three laws of accepted Core,
and that no transition between frames of two objects is accepted.
"""

[property."frame.transitions".claim.test]
status = "tested"
evidence = [
  "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package",
  "tests/frame_primitives.rs::frame_program_checks_builds_and_prints_42",
  "VastitasKernel.FrameRuntimeRegression",
  "VastitasKernel.FrameRegression",
]

[property."frame.change-of-frame"]
title = "Change of frame of a map array"
subject = "std::geometry::frame::FrameMap"
statement = """
Let F be a smooth map, p a point, b and b′ frames of its source and c a frame
of its target. The map array of F at p in (b′, c) is the map array in (b, c)
after the transition from b′ to b at p.
"""
specified_in = "[ADR 0001 §11, Laws](adr/0001-mathematics-first-stdlib.md#laws-1)"
example = """
For f(x, y) = x² + y at (1, 2) and the frame l = columns((2)) of the line,
the map array in (b, l) is (1, 2). After the transition from r to b it is the
map array (1, 3/2) in (r, l).
"""
example_test = "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package"

[property."frame.change-of-frame".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.FrameRuntime.frameMatrix_natural",
  "VastitasOracle.FrameAcceptance.c7_two_frame_pairs",
]
premises = [
  "for `frameMatrix_natural`: F is well typed from n to m coordinates, the point has n coordinates, the frames b and c are invertible at p and at F(p), and the inverses of b′ and c′ have n and m rows",
  "for `c7_two_frame_pairs`: the declaration environment of the module is valid, and the map and point operands evaluate to values of their checked types",
]
assumes = ["rust-frontend"]
note = """
Both theorems state the law for two pairs of frames, (b, c) and (b′, c′):
the map array in (b′, c′) is the transition from c to c′ at F(p), after the
map array in (b, c), after the transition from b′ to b at p. When c′ is c the
first transition is the identity (`transition_laws`). The proofs read the
rows of a map array as the Jacobian through `VastitasOracle.SmoothCalculus.backward_eq_cot`,
a chain-rule theorem of the oracle.
"""

[property."frame.change-of-frame".claim.bridge]
status = "proved-bridge"
evidence = [
  "VastitasBridge.Differential.frame_arrays_same_map",
  "VastitasBridge.Differential.checked_frame_arrays_same_map",
]
premises = [
  "for `frame_arrays_same_map`: F is well typed from n to m coordinates, the point has n coordinates, and the four frames are invertible at p or at F(p)",
  "for `checked_frame_arrays_same_map`: the declaration environment of the module is valid, and the map and point operands evaluate to values of their checked types",
]
assumes = ["mathlib", "rust-frontend"]
note = """
The two map arrays in (b, c) and (b′, c′) decode, with `Matrix.toLin` in
their frames, to one linear map: the Fréchet derivative `fderiv ℝ` of the
real map of F at p. The second array is the first between the transitions
`Q_c′·P_c` and `Q_b·P_b′`. The proofs read the reverse pass through
`reverse_covector_eq_comp_fderiv` and use no chain-rule theorem;
`lean-bridge/Audit.lean` checks this.
"""

[property."frame.change-of-frame".claim.test]
status = "tested"
evidence = [
  "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package",
  "tests/stdlib_frames.rs::mutated_frame_observations_change_the_native_result",
  "tests/frame_primitives.rs::frame_program_checks_builds_and_prints_42",
  "VastitasKernel.FrameRegression",
]

[property."frame.pairing"]
title = "Pairing in a frame"
subject = "std::geometry::frame::CoCoords"
statement = """
The pairing of the coframe array of a covector α with the frame array of a
vector v in the same frame is α(v), whatever the frame.
"""
specified_in = "[ADR 0001 §11, Laws](adr/0001-mathematics-first-stdlib.md#laws-1)"
example = """
The covector (2, 1) and the vector (3, 2) at (1, 2) pair to 8. Their arrays
(2, 4) and (2, 1) in b pair to 8 as well.
"""
example_test = "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package"

[property."frame.pairing".claim.oracle]
status = "proved-oracle"
evidence = [
  "VastitasOracle.FrameRuntime.pairing_invariant",
  "VastitasOracle.FrameAcceptance.c6_pairing",
]
premises = [
  "for `pairing_invariant`: P(p)·Q(p) = I at the point p of the covector, and the covector and the vector each have one point coordinate and one component per frame vector",
  "for `c6_pairing`: the declaration environment of the module is valid, and the covector and vector operands evaluate to values of their checked types",
]
assumes = ["rust-frontend"]
note = """
`c6_pairing` states that an accepted `frame_pairing` of two encodings pairs
arrays in one frame, which the call fixes, and evaluates to the pairing of
the covector and the vector, a value that names no frame. Over two different
points the pairing reads (0, 0).
"""

[property."frame.pairing".claim.bridge]
status = "proved-bridge"
evidence = ["VastitasBridge.Differential.pairing_in_frame"]
premises = [
  "the covector and the vector lie over one point, where P·Q = Q·P = I, and each has one point coordinate and one component per frame vector",
]
assumes = ["mathlib"]
note = """
The pairing of the two arrays is the sum over i of the coordinate i of the
covector in the dual basis times the coordinate i of the vector in the frame,
as a basis of ℝⁿ, and it equals α ⬝ᵥ v.
"""

[property."frame.pairing".claim.test]
status = "tested"
evidence = [
  "tests/stdlib_frames.rs::frames_from_the_library_check_build_and_run_from_a_path_package",
  "tests/frame_primitives.rs::frame_program_checks_builds_and_prints_42",
]
