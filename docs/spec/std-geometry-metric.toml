# Properties of std::geometry::metric. docs/specifications.md defines the
# format; scripts/check_spec.py checks this file and generates
# std-geometry-metric.md.

[spec]
id = "metric"
title = "std::geometry::metric"
subject = "std::geometry::metric"
description = """
The laws of the musical maps of a named metric, from ADR 0001 §10. A metric g
on a smooth affine object, of the family `MetricForm`, has a symmetric rational
Gram matrix G. `flat` with g maps a vector v at x to the covector Gv at x.
`sharp` with g and nondegenerate evidence e for g maps a covector α at x to the
vector G⁻¹α at x, where e certifies G⁻¹.
"""

[property."metric.sharp-flat"]
title = "sharp after flat"
subject = "std::geometry::metric::MetricForm"
statement = """
Let g be a metric with nondegenerate evidence e. Then `sharp` with g and e
undoes `flat` with g: sharp(flat(v)) = v for the failure value ⊥ and for every
vector v with one component per coordinate of the metric's object.
"""
specified_in = "[ADR 0001 §10, Laws](adr/0001-mathematics-first-stdlib.md#laws)"
example = """
For the Euclidean metric and for the metric gram((2, 1), (1, 1)) of the plane,
sharp(flat(v)) = v for the vector v = (5, -7) at (1, 2).
"""
example_test = "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes"

[property."metric.sharp-flat".claim.binding]
status = "proved-oracle"
evidence = [
  "VastitasOracle.SmoothMetricForms.flat_uses_declared_gram",
  "VastitasOracle.SmoothMetricForms.sharp_requires_nondegenerate",
  "VastitasOracle.SmoothMetricForms.flat_sharp_erasure",
]
premises = [
  "for `flat_uses_declared_gram` and `sharp_requires_nondegenerate`: the `flat` and `sharp` bindings are valid in their checked declaration environment",
]
assumes = ["rust-frontend"]
note = """
A valid `flat` with g applies the Gram matrix of g, and a valid `sharp` with g
and e applies the inverse that e certifies. The `bridge` claim shows that
those two runtime maps undo each other.
"""

[property."metric.sharp-flat".claim.bridge]
status = "proved-bridge"
evidence = [
  "VastitasBridge.Differential.sharp_flat",
  "VastitasBridge.Differential.checked_flat_sharp",
]
premises = [
  "for `sharp_flat`: the Gram matrix and the inverse pass `checkNondegenerate`, and the fiber has n components or is ⊥",
  "for `checked_flat_sharp`: the checked declaration environment is valid and contains the nondegenerate evidence declaration; the theorem derives the Gram matrix, the dimension n and the certified inverse, and states the law for fibers with n components and for ⊥",
]
assumes = ["mathlib", "rust-frontend"]

[property."metric.sharp-flat".claim.test]
status = "tested"
evidence = [
  "tests/smooth_differential.rs::smooth_example_checks_builds_and_executes",
  "tests/smooth_differential.rs::mutated_observations_change_the_native_result",
]
note = """
Observation 23 of the [acceptance example](../stage3-acceptance.md#acceptance-conditions)
checks sharp(flat(v)) = v for two metrics.
"""

[property."metric.sharp-flat".claim.native]
status = "not-claimed"
reason = """
The theorems concern the Lean runtime definitions that the checker and the
generated programs share. No claim states that the compiled native code
refines them. Tests run the native code.
"""

[property."metric.flat-sharp"]
title = "flat after sharp"
subject = "std::geometry::metric::MetricForm"
statement = """
Let g be a metric with nondegenerate evidence e. Then `flat` with g undoes
`sharp` with g and e: flat(sharp(α)) = α for the failure value ⊥ and for every
covector α with one component per coordinate of the metric's object.
"""
specified_in = "[ADR 0001 §10, Laws](adr/0001-mathematics-first-stdlib.md#laws)"
example = """
Take the metric gram((2, 1), (1, 1)) of the plane and g(x, y) = x² + y. The
differential (2, 1) of g at (1, 2) raises to the gradient (1, 0), and `flat`
lowers (1, 0) back to (2, 1).
"""
example_test = "tests/stdlib_differential.rs::library_profile_checks_builds_and_runs_from_a_path_package"

[property."metric.flat-sharp".claim.binding]
status = "proved-oracle"
evidence = [
  "VastitasOracle.SmoothMetricForms.flat_uses_declared_gram",
  "VastitasOracle.SmoothMetricForms.sharp_requires_nondegenerate",
  "VastitasOracle.SmoothMetricForms.flat_sharp_erasure",
]
premises = [
  "for `flat_uses_declared_gram` and `sharp_requires_nondegenerate`: the `flat` and `sharp` bindings are valid in their checked declaration environment",
]
assumes = ["rust-frontend"]
note = """
A valid `flat` with g applies the Gram matrix of g, and a valid `sharp` with g
and e applies the inverse that e certifies. The `bridge` claim shows that
those two runtime maps undo each other.
"""

[property."metric.flat-sharp".claim.bridge]
status = "proved-bridge"
evidence = [
  "VastitasBridge.Differential.flat_sharp",
  "VastitasBridge.Differential.checked_flat_sharp",
]
premises = [
  "for `flat_sharp`: the Gram matrix and the inverse pass `checkNondegenerate`, and the fiber has n components or is ⊥",
  "for `checked_flat_sharp`: the checked declaration environment is valid and contains the nondegenerate evidence declaration; the theorem derives the Gram matrix, the dimension n and the certified inverse, and states the law for fibers with n components and for ⊥",
]
assumes = ["mathlib", "rust-frontend"]

[property."metric.flat-sharp".claim.test]
status = "tested"
evidence = [
  "tests/stdlib_differential.rs::library_profile_checks_builds_and_runs_from_a_path_package",
  "tests/stdlib_differential.rs::mutated_observations_change_the_native_result",
