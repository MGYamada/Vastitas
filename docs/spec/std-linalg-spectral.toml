[property."spectral.invariants"]
title = "Invariants are smooth maps"
subject = "std::linalg::spectral::Endomorphism"
statement = """
`trace_power(H, k)`, for 1 ≤ k ≤ 8, is the smooth map tr(Hᵏ) from the object
of H to a line, and `char_coefficient(S, i)` is the coefficient of tⁱ in χ.
Each is an ordinary smooth map: its differential, its gradient under a metric
and its compiled reverse pass are those of `std::differential`, and it has no
reverse rule of its own. The kernel computes the map from the declaration; a
map on the wire is an error (`E_PROTOCOL`).
"""
specified_in = "[ADR 0001 §12, Contract and jurisdiction](adr/0001-mathematics-first-stdlib.md#contract-and-jurisdiction-2)"
example = """
For H = rows((x, y), (y, −x)), `trace_power(H, 2)` is the map 2x² + 2y², equal
to the map `pullback(t -> 2*x^2 + 2*y^2)`. Its gradient on the dimensionless
Euclidean chart is (4x, 4y): (4, 8) at (1, 2) and (0, 0) at the origin. tr(H)
is 0, whose differential is the zero covector over the point and not ⊥, and
the coefficient of t⁰ is −x² − y², whose gradient is −1/2 that of tr(H²).
"""
example_test = "tests/spectral_observations.rs::the_example_checks_builds_and_prints_42_in_place"

