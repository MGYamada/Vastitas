[property."spectral.branch-observations"]
title = "Branch points, differentials and eigenprojectors"
subject = "std::linalg::spectral::Branch"
statement = """
Let p be a point and t a rational on the line. `on_branch` is true exactly
when g(p) ≠ 0 and χ(p, t) = 0. At such a branch point,
`branch_differential` is the covector −Σᵢ (∂ᵢχ / χ′)(p, t) dxᵢ, and
`branch_projector` with eᵢ and eⱼ is the entry (eᵢ, eⱼ) of
adj(tI − H(p)) / χ′(p, t). Off the chart the differential is ⊥ and an entry
reads (0, 0). No observation computes, orders or chooses an eigenvalue.
"""
specified_in = "[ADR 0001 §12, Laws](adr/0001-mathematics-first-stdlib.md#laws-2)"
example = """
At p = (3, 4) the eigenvalues 5 and −5 are on the branch of D(x² + y²), and 4
is not; the origin is off the chart, although χ(0, 0) = 0 at t = 0. The
differentials are (3/5, 4/5) and (−3/5, −4/5), unit covectors under the
Euclidean metric, and the eigenprojectors are (1/5)[[4, 2], [2, 1]] and
(1/5)[[1, −2], [−2, 4]].
"""
example_test = "tests/spectral_observations.rs::the_example_checks_builds_and_prints_42_in_place"

