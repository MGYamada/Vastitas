[property."spectral.module-action"]
title = "The module action tells fields apart"
subject = "std::linalg::spectral::Spectrum"
statement = """
`annihilates(…, spectrum = S, element = f)` at a point p is true exactly when
f(H(p)) = 0, and `action_entry(…, spectrum = S, element = f, eᵢ, eⱼ)` is the
entry (eᵢ, eⱼ) of f(H(p)), for f in A[t]. The spectrum is the characteristic
scheme of H, never its reduced spectrum or the locus of an annihilator: two
fields with the same χ, the same trace powers and the same coefficients can
differ in their module action.
"""
specified_in = "[ADR 0001 §12, Contract and jurisdiction](adr/0001-mathematics-first-stdlib.md#contract-and-jurisdiction-2)"
example = """
On the point, 2I and J = [[2, 1], [0, 2]] both have χ = (t − 2)², the trace
powers 4 and 8 and the same coefficients. t − 2 annihilates 2I and not J, and
the entry (f1, f2) of J − 2I is 1, that of 2I − 2I is 0. (t − 2)² annihilates
both (Cayley–Hamilton). The fields 0 and N = [[0, 1], [0, 0]] differ in the
same way.
"""
example_test = "tests/spectral_observations.rs::the_example_checks_builds_and_prints_42_in_place"

