[property."spectral.branch-chart"]
title = "A branch is a certified finite chart"
subject = "std::linalg::spectral::Branch"
statement = """
`simple(S, localize = g, witness = W, exponent = e)` is accepted only when g
is a nonzero polynomial in the coordinates of the object, without the fiber
coordinate, W has degree below n in t, e ≤ 8, and W·χ′ − gᵉ is a multiple
of χ, which the kernel checks against a quotient that it computes. Any other
chart is an error (`E_SPECTRAL`). On D(g) every eigenvalue of H(p) is simple.
"""
specified_in = "[ADR 0001 §12, Negative tests](adr/0001-mathematics-first-stdlib.md#negative-tests-2)"
example = """
For χ = t² − x² − y², the witness t/2 certifies D(x² + y²): (t/2)·2t = t² is
x² + y² modulo χ. The same witness with g = 1 is an error, because the
eigenvalues meet at the origin, and so is the witness (1/2 + 10⁻²⁰)t. The
Jordan block [[2, 1], [0, 2]] has no chart, because χ′ = 2(t − 2) is
nilpotent modulo χ = (t − 2)².
"""
example_test = "tests/spectral_observations.rs::rejected_stage5_packages_print_their_diagnostics"

[property."spectral.branch-chart".claim.test]
status = "tested"
evidence = [
  "tests/spectral_observations.rs::rejected_stage5_packages_print_their_diagnostics",
  "tests/spectral_observations.rs::tampered_spectral_declarations_are_rejected_by_the_kernel",
