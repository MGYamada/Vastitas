[property."spectral.pair"]
title = "The spectral pair is computed and checked"
subject = "std::linalg::spectral::Spectrum"
statement = """
For a spectrum `eigen(H, t)` the kernel computes χ = det(tI − H) and
adj(tI − H), and accepts the declaration only when χ equals the cofactor
determinant of tI − H, (tI − H)·adj = χ·I, the trace of the adjugate is χ′,
χ(H) = 0, adj² − χ′·adj is a multiple of χ, and Jacobi's formula
∂ᵢχ + tr(adj·∂ᵢH) = 0 holds for each coordinate. Every identity modulo χ is
checked against a quotient that the kernel computes. No characteristic
polynomial, adjugate or quotient comes from the source or the wire.
"""
specified_in = "[ADR 0001 §12, Contract and jurisdiction](adr/0001-mathematics-first-stdlib.md#contract-and-jurisdiction-2)"
example = """
For H = rows((x, y), (y, −x)) the kernel computes χ = t² − x² − y² and
adj(tI − H) = tI + H. A spectrum record with a field `characteristic`,
`adjugate` or `quotient` is an error (`E_PROTOCOL`).
"""
example_test = "tests/spectral_observations.rs::raw_wire_rejects_spectral_certificates_and_forged_maps"

[property."spectral.pair".claim.test]
status = "tested"
evidence = [
  "tests/spectral_observations.rs::raw_wire_rejects_spectral_certificates_and_forged_maps",
  "tests/spectral_declarations.rs::raw_wire_rejects_certificates_and_forged_spectral_fields",
  "VastitasKernel.SpectralDeclarationRegression",
  "VastitasKernel.SpectralRegression",
]
note = """
`SpectralDeclarationRegression` runs the producer and the checks of the
spectral pair on the fields of the acceptance program and on fields whose
certificates are forged, which the checks reject. `SpectralRegression`
forges the characteristic polynomial and the adjugate embedded in checked
Core, which the kernel's audit rejects.
"""

