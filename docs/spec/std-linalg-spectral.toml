[property."spectral.limits"]
title = "The finite profile"
subject = "std::linalg::spectral::FreeModule"
statement = """
A free module has at most 4 basis vectors (`spectralRank`), and a trace power
and the exponent of a branch are at most 8 (`spectralPower`). Every
polynomial that the kernel reads or computes for a field, a spectral pair, a
trace power or a witness check is within the term limit, and its computation
within the work budget, of the exact algebra. Beyond a limit the declaration
is an error (`E_LIMIT`), reported before any identity is compared.
"""
specified_in = "[ADR 0001 §12, Execution and evidence profile](adr/0001-mathematics-first-stdlib.md#execution-and-evidence-profile-2)"
example = """
A free module with the basis e1, …, e5 is an error (`E_LIMIT`), and so is
`trace_power(H, 9)`. A symmetric 4 × 4 field whose entries are the 455-term
polynomial (1 + x0 + … + x11)³ stops on the work budget while its spectral
pair is computed.
"""
example_test = "tests/spectral_limits.rs::the_rank_is_bounded_at_the_free_module"

