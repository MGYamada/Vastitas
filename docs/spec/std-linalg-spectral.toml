# Properties of std::linalg::spectral. docs/specifications.md defines the
# format; scripts/check_spec.py checks this file and generates
# std-linalg-spectral.md.

[spec]
id = "spectral"
title = "std::linalg::spectral"
subject = "std::linalg::spectral"
description = """
The properties of the exact spectral profile of polynomial matrix fields, from
ADR 0001 §12. Let A be the ring of the polynomials with exact rational
coefficients in the coordinates of a smooth affine object X. A free module V
on X is Aⁿ with a named basis, with n at most 4, and an endomorphism field H
of V is an n × n matrix over A. The spectral pair of H has the characteristic
polynomial χ = det(tI − H) in A[t], with a named fiber coordinate t, and the
module V on which t acts as H. A branch is a finite chart D(g) of the
spectrum, certified by a witness W with W·χ′ ≡ gᵉ modulo χ, on which every
eigenvalue is simple. The module declares the families `FreeModule<X>`,
`Endomorphism<X>`, `Spectrum<X>` and `Branch<X>`. The application declares
each module, field, spectrum and branch, the invariants `trace_power` and
`char_coefficient`, and the observations `annihilates`, `action_entry`,
`on_branch`, `branch_differential` and `branch_projector`. The failure value
⊥ lies over no point.
"""

[property."spectral.static-identity"]
title = "Objects and spectra are static"
subject = "std::linalg::spectral::Spectrum"
statement = """
A field acts on a free module of its own object, a spectrum is the spectrum
of a field of its own object, and a branch is a chart of a spectrum of its own
object; any other declaration is an error (`E_SPECTRAL`). An observation names
its spectrum or its branch in its binding. It accepts a point only of the
object of that spectrum or branch, and a branch observation accepts an
eigenvalue only on its declared line. Any other operand is an error
(`E_ENDPOINT`).
"""
specified_in = "[ADR 0001 §12, Contract and jurisdiction](adr/0001-mathematics-first-stdlib.md#contract-and-jurisdiction-2)"
example = """
On the plane, let H = rows((x, y), (y, −x)) act on V = basis(e1, e2). A
field `rows((u, v), (v, −u))` of V on a second plane with the coordinates u
and v is an error (`E_SPECTRAL`), although both planes have the dimension 2.
An observation of the spectrum of the field 2I on the point, applied to a
point of the plane, is an error (`E_ENDPOINT`).
"""
example_test = "tests/spectral_observations.rs::spectral_mismatches_are_rejected_statically"

[property."spectral.static-identity".claim.binding]
status = "proved-oracle"
evidence = [
  "VastitasOracle.SpectralPrimitives.annihilates_association",
  "VastitasOracle.SpectralPrimitives.actionEntry_association",
  "VastitasOracle.SpectralPrimitives.onBranch_association",
  "VastitasOracle.SpectralPrimitives.branchDifferential_association",
  "VastitasOracle.SpectralPrimitives.branchProjector_association",
]
premises = []
assumes = ["rust-frontend"]
note = """
Each theorem characterizes the operand types that the shape of a spectral
binding associates with a result: the point is a smooth map from a point of
dimension 0 to the object of the embedded spectrum or branch, and the
eigenvalue of a branch observation is a smooth map from that point to the
declared line. The kernel's typing of a call reads that association, so the
theorems concern checked bindings, and the Rust frontend relates them to
source declarations.
"""

