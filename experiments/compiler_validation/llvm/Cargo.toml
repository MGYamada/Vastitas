[package]
name = "vastitas-llvm-qualification"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.99.1"

[features]
default = ["llvm-static"]
llvm-static = ["llvm-sys/force-static"]
llvm-dynamic = ["llvm-sys/force-dynamic"]

[dependencies]
llvm-sys = { version = "=231.0.1", default-features = false }

# The qualification executable shares the compiler's libLLVM adapter source.
# Keep its independent lock and static/dynamic qualification choices.
[workspace]
