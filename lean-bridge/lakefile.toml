name = "vastitas_bridge"
version = "0.1.0"
license = "Apache-2.0"
licenseFiles = ["../LICENSE"]
defaultTargets = ["VastitasBridge"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# The implementation correspondence reads the actual kernel and Oracle
# sources. The dependency is one way: neither package may import Mathlib.
[[require]]
name = "vastitas_kernel"
path = "../lean-kernel"

[[require]]
name = "vastitas_oracle"
path = "../lean"

[[lean_lib]]
name = "VastitasBridge"
