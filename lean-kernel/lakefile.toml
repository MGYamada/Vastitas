name = "vastitas_kernel"
version = "0.1.0"
license = "Apache-2.0"
licenseFiles = ["../LICENSE"]
defaultTargets = ["vastitas-kernel"]

[[lean_lib]]
name = "VastitasKernel"
needs = ["compilerLimits"]

[[input_file]]
name = "compilerLimits"
path = "compiler-limits.json"
text = true

[[input_file]]
name = "promotionFixture"
path = "../tests/fixtures/promotion.json"
text = true

# Test/proof fixtures are separate from the ordinary compiler library.
[[lean_lib]]
name = "VastitasPromotion"
roots = ["VastitasPromotion.Fixture", "VastitasPromotion.Regression"]
needs = ["promotionFixture"]

[[lean_exe]]
name = "vastitas-kernel"
root = "Main"
